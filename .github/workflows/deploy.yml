name: Deploy to Hostinger

# MANUAL DEPLOY ONLY. Pushing to main does NOT deploy anything by itself
# anymore — it only updates GitHub. This workflow only runs when someone
# explicitly triggers it (GitHub → Actions → "Deploy to Hostinger" → Run
# workflow), or when Cece has approved a specific change and asked for it
# to go live.
#
# 2026-07-21: changed from auto-deploy-on-push after Cece asked to be
# consulted and shown a preview before anything ships. Do not change this
# trigger back to `on: push` without her explicit ok.
#
# ─── ONE-TIME SETUP REQUIRED (do this in GitHub, not in this file) ───
# Go to: repo → Settings → Secrets and variables → Actions → New repository secret
# Add these three secrets (get the values from Hostinger hPanel → FTP Accounts):
#   HOSTINGER_FTP_SERVER    e.g. ftp.mynestchapter.com
#   HOSTINGER_FTP_USERNAME  your Hostinger FTP username
#   HOSTINGER_FTP_PASSWORD  your Hostinger FTP password
# Never put these values directly in this file or in chat with any AI tool.
#
# This workflow is disabled from actually deploying until those secrets exist —
# the FTP step will simply fail with a clear "missing secret" error, it won't
# silently do nothing or push garbage credentials.
#
# 2026-07-13: FTP password re-verified in Hostinger hPanel and secret updated.

on:
  workflow_dispatch:

jobs:
  qa-check:
    name: Brand & Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MNC QA checks
        run: python3 .github/scripts/mnc_qa.py

  deploy:
    name: FTP Deploy to Hostinger
    needs: qa-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # 2026-07-22: root-caused for real this time — checked hPanel → Files →
          # FTP Accounts directly (not inferred from File Manager browsing, which
          # was using different, broader-scoped credentials than this deploy
          # secret). The dedicated "u540670132.deploy" FTP account is rooted
          # exactly at /home/u540670132/domains/mynestchapter.com/public_html —
          # i.e. the real live docroot itself, with zero extra path needed.
          # Both the 2026-07-18 "chroot auto-prepends public_html" theory and the
          # follow-up "server-dir: ../" fix were wrong — they were reverse-engineered
          # from observed bad behavior without ever checking this authoritative
          # FTP Accounts panel, which states the account's directory directly.
          # server-dir is intentionally empty: deploy straight into FTP's home.
          # If this ever looks wrong again, check hPanel → Files → FTP Accounts
          # FIRST — it states the true root directly, no inference needed — before
          # trusting this workflow's green checkmark (a successful FTP upload does
          # not mean it landed in the folder the site actually serves from).
          local-dir: site/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/_stray_assets/**
            **/_archive/**
            **/*.md
            **/node_modules/**
            **/.claude/**
            **/*DRAFT*

      - name: Deploy widgets/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # 2026-07-22: matching the site/ step fix above — the FTP account's home
          # (confirmed in hPanel → Files → FTP Accounts) IS the real docroot
          # (public_html), so "widgets/" alone — relative to that home, no extra
          # "public_html" prefix or "../" needed — lands at the real
          # public_html/widgets/ the live site serves from. Previous attempts
          # (plain "widgets/", then "../widgets/") were both reverse-engineered
          # from observed behavior without checking the FTP Accounts panel first.
          # know-before-you-sell/ is deliberately excluded: CLAUDE.md flags it as
          # pulled off the live site pending Cece's review of which version is
          # correct — do not let an auto-deploy put it back live silently.
          local-dir: widgets/
          server-dir: widgets/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/_stray_assets/**
            **/_archive/**
            **/*.md
            **/node_modules/**
            **/.claude/**
            **/*DRAFT*
            **/know-before-you-sell/**
