name: Deploy to Hostinger

# MANUAL DEPLOY ONLY. Pushing to main does NOT deploy anything by itself
# anymore — it only updates GitHub. This workflow only runs when someone
# explicitly triggers it (GitHub → Actions → "Deploy to Hostinger" → Run
# workflow), or when Cece has approved a specific change and asked for it
# to go live.
#
# 2026-07-21: changed from auto-deploy-on-push after Cece asked to be
# consulted and shown a preview before anything ships. Do not change this
# trigger back to `on: push` without her explicit ok.
#
# ─── ONE-TIME SETUP REQUIRED (do this in GitHub, not in this file) ───
# Go to: repo → Settings → Secrets and variables → Actions → New repository secret
# Add these three secrets (get the values from Hostinger hPanel → FTP Accounts):
#   HOSTINGER_FTP_SERVER    e.g. ftp.mynestchapter.com
#   HOSTINGER_FTP_USERNAME  your Hostinger FTP username
#   HOSTINGER_FTP_PASSWORD  your Hostinger FTP password
# Never put these values directly in this file or in chat with any AI tool.
#
# This workflow is disabled from actually deploying until those secrets exist —
# the FTP step will simply fail with a clear "missing secret" error, it won't
# silently do nothing or push garbage credentials.
#
# 2026-07-13: FTP password re-verified in Hostinger hPanel and secret updated.

on:
  workflow_dispatch:

jobs:
  qa-check:
    name: Brand & Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MNC QA checks
        run: python3 .github/scripts/mnc_qa.py

  deploy:
    name: FTP Deploy to Hostinger
    needs: qa-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # 2026-07-22: the 2026-07-18 "server-dir: site/" theory below was WRONG —
          # verified directly in Hostinger File Manager. Files were landing at
          # public_html/public_html/site/ (two nested public_html folders), while
          # the real live site is served from public_html/ (single level, one
          # folder up from "My files" root). The FTP session already lands inside
          # the real public_html on connect; something (Hostinger server-side, or
          # the action) then glues one more "public_html/" onto whatever server-dir
          # is requested. "../" cancels that extra segment back out to the true
          # FTP home, which IS the real docroot — confirmed against the live
          # ./public_html/login.php file found via File Manager search.
          # If this still lands wrong, check Hostinger File Manager directly
          # (search for a known filename like login.php from the account root)
          # rather than trusting this workflow's green checkmark — a successful
          # FTP upload does not mean it landed in the folder the site serves from.
          #
          # 2026-07-18 (SUPERSEDED, kept for history): This account's FTP chroot
          # auto-prepends "public_html" to every path requested — confirmed by
          # direct testing (requesting "/public_html" resolved to
          # "/public_html/public_html"; requesting the full absolute path also
          # got "/public_html" stuck on the front). The real live site files live
          # at the filesystem path .../public_html/site/ relative to the account's
          # true home. Given the chroot's auto-prepend, requesting server-dir
          # "site" (no "public_html" in it at all) is what actually lands there —
          # confirmed by direct FTP browser test. [This was not actually re-verified
          # against the live site's real serving directory — that's what was wrong.]
          local-dir: site/
          server-dir: ../
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/_stray_assets/**
            **/_archive/**
            **/*.md
            **/node_modules/**
            **/.claude/**
            **/*DRAFT*

      - name: Deploy widgets/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # 2026-07-22: matching the site/ step fix above — "server-dir: widgets/"
          # was landing at public_html/public_html/widgets/, not the real
          # public_html/widgets/ that the live site actually serves (confirmed via
          # File Manager: the real widgets/garage-sale-planner/widget.html sat
          # untouched at 12 days old while this step reported "success"). "../widgets/"
          # cancels out the same extra "public_html/" segment the site/ step has.
          # know-before-you-sell/ is deliberately excluded: CLAUDE.md flags it as
          # pulled off the live site pending Cece's review of which version is
          # correct — do not let an auto-deploy put it back live silently.
          local-dir: widgets/
          server-dir: ../widgets/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/_stray_assets/**
            **/_archive/**
            **/*.md
            **/node_modules/**
            **/.claude/**
            **/*DRAFT*
            **/know-before-you-sell/**
