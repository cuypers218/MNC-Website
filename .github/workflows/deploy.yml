name: Deploy to Hostinger

# Runs on every push to main. QA checks must pass before anything deploys.
#
# ─── ONE-TIME SETUP REQUIRED (do this in GitHub, not in this file) ───
# Go to: repo → Settings → Secrets and variables → Actions → New repository secret
# Add these three secrets (get the values from Hostinger hPanel → FTP Accounts):
#   HOSTINGER_FTP_SERVER    e.g. ftp.mynestchapter.com
#   HOSTINGER_FTP_USERNAME  your Hostinger FTP username
#   HOSTINGER_FTP_PASSWORD  your Hostinger FTP password
# Never put these values directly in this file or in chat with any AI tool.
#
# This workflow is disabled from actually deploying until those secrets exist —
# the FTP step will simply fail with a clear "missing secret" error, it won't
# silently do nothing or push garbage credentials.
#
# 2026-07-13: FTP password re-verified in Hostinger hPanel and secret updated.

on:
  push:
    branches: [main]

jobs:
  qa-check:
    name: Brand & Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MNC QA checks
        run: python3 .github/scripts/mnc_qa.py

  deploy:
    name: FTP Deploy to Hostinger
    needs: qa-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # 2026-07-18: root-caused with Hostinger support after the 2026-07-16
          # account incident. This account's FTP chroot auto-prepends "public_html"
          # to every path requested — confirmed by direct testing (requesting
          # "/public_html" resolved to "/public_html/public_html"; requesting the
          # full absolute path also got "/public_html" stuck on the front). The
          # real live site files live at the filesystem path .../public_html/site/
          # relative to the account's true home. Given the chroot's auto-prepend,
          # requesting server-dir "site" (no "public_html" in it at all) is what
          # actually lands there — confirmed by direct FTP browser test.
          # local-dir is scoped to the repo's site/ folder so its contents land
          # flattened at the right place, matching this server-dir.
          # widgets/ is NOT deployed by this step yet — out of scope until it gets
          # its own migration pass (see mnc_qa.py's NEW_STANDARD_WIDGET_FILES notes).
          local-dir: site/
          server-dir: site/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/_stray_assets/**
            **/_archive/**
            **/*.md
            **/node_modules/**
            **/.claude/**
            **/*DRAFT*
