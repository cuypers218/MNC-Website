name: Deploy to Hostinger

# AUTO-DEPLOYS ON EVERY PUSH TO main. Can still be run manually too
# (GitHub → Actions → "Deploy to Hostinger" → Run workflow).
#
# 2026-07-21: switched to manual-only after Cece asked to be consulted and
# shown a preview before anything ships.
# 2026-07-23: Cece asked to revert back to auto-deploy-on-push (explicit
# ok given directly, superseding the 2026-07-21 note above).
#
# ─── ONE-TIME SETUP REQUIRED (do this in GitHub, not in this file) ───
# Go to: repo → Settings → Secrets and variables → Actions → New repository secret
# Add these three secrets (get the values from Hostinger hPanel → FTP Accounts):
#   HOSTINGER_FTP_SERVER    e.g. ftp.mynestchapter.com
#   HOSTINGER_FTP_USERNAME  your Hostinger FTP username
#   HOSTINGER_FTP_PASSWORD  your Hostinger FTP password
# Never put these values directly in this file or in chat with any AI tool.
#
# This workflow is disabled from actually deploying until those secrets exist —
# the FTP step will simply fail with a clear "missing secret" error, it won't
# silently do nothing or push garbage credentials.
#
# 2026-07-13: FTP password re-verified in Hostinger hPanel and secret updated.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qa-check:
    name: Brand & Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MNC QA checks
        run: python3 .github/scripts/mnc_qa.py

  deploy:
    name: FTP Deploy to Hostinger
    needs: qa-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # 2026-07-22 (this fix is the one that's actually been verified live):
          # the "server-dir: ./" change above (from "root-caused for real this
          # time") was WRONG and never re-tested against the live site — it just
          # trusted the FTP Accounts panel's stated directory. A real test (push
          # a brand-new canary file, then curl it on the live domain) showed it
          # 404s: the file actually lands two folders deep, in an extra
          # public_html/public_html/ that isn't served. This reproduces the
          # exact symptom the EARLIER "server-dir: ../" fix (commit d300e87) had
          # already found and fixed, verified that time against a real live file
          # (login.php) — the very next commit undid it without re-verifying.
          # Restoring "../": it cancels out whatever extra "public_html/" segment
          # gets glued onto server-dir, landing back at the true FTP home, which
          # is the real docroot. Do not change this again without a live canary-
          # file test (push a uniquely-named file, curl it on mynestchapter.com,
          # confirm 200) — a green checkmark or a panel's stated path is not proof.
          local-dir: site/
          server-dir: ../
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/_stray_assets/**
            **/_archive/**
            **/*.md
            **/node_modules/**
            **/.claude/**
            **/*DRAFT*
            # Runtime, user-generated content that lives only on the live server —
            # never committed to git (see .gitignore). Must stay excluded from
            # every sync so a full state-file rebuild never deletes real uploads/
            # purchased PDFs/product photos that aren't tracked here.
            uploads/**
            downloads/exclusive/**
            downloads/freebies/**
            downloads/products/**

      - name: Deploy widgets/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # 2026-07-22: matching the site/ step fix above — "server-dir: widgets/"
          # (from the unverified "checked FTP Accounts panel" fix) was landing at
          # public_html/public_html/widgets/, confirmed via a live canary-file
          # test (pushed a new file, curl'd it on mynestchapter.com, got a 404).
          # "../widgets/" restores the commit d300e87 fix, which WAS verified
          # against a real live file at the time — cancels out the same extra
          # "public_html/" segment the site/ step has.
          # know-before-you-sell/ is deliberately excluded: CLAUDE.md flags it as
          # pulled off the live site pending Cece's review of which version is
          # correct — do not let an auto-deploy put it back live silently.
          local-dir: widgets/
          server-dir: ../widgets/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/_stray_assets/**
            **/_archive/**
            **/*.md
            **/node_modules/**
            **/.claude/**
            **/*DRAFT*
            **/know-before-you-sell/**
