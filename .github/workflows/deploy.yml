name: Deploy to Hostinger

# Runs on every push to main. QA checks must pass before anything deploys.
#
# ─── ONE-TIME SETUP REQUIRED (do this in GitHub, not in this file) ───
# Go to: repo → Settings → Secrets and variables → Actions → New repository secret
# Add these three secrets (get the values from Hostinger hPanel → FTP Accounts):
#   HOSTINGER_FTP_SERVER    e.g. ftp.mynestchapter.com
#   HOSTINGER_FTP_USERNAME  your Hostinger FTP username
#   HOSTINGER_FTP_PASSWORD  your Hostinger FTP password
# Never put these values directly in this file or in chat with any AI tool.
#
# This workflow is disabled from actually deploying until those secrets exist —
# the FTP step will simply fail with a clear "missing secret" error, it won't
# silently do nothing or push garbage credentials.
#
# 2026-07-13: FTP password re-verified in Hostinger hPanel and secret updated.

on:
  push:
    branches: [main]

jobs:
  qa-check:
    name: Brand & Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run MNC QA checks
        run: python3 .github/scripts/mnc_qa.py

  deploy:
    name: FTP Deploy to Hostinger
    needs: qa-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # 2026-07-17: Hostinger support confirmed the FTP account is jailed to
          # /home/u540670132/domains/mynestchapter.com/, and "public_html" (relative,
          # no leading slash) is the correct resolved path. Switching from the
          # absolute-style "/public_html/" to a bare relative path, since leading-
          # slash handling can differ between FTP clients/jailed accounts and this
          # may be why prior deploys silently uploaded nowhere useful despite
          # succeeding. Confirmed via Hostinger hPanel > Files > FTP Accounts
          # ("Folder to upload files").
          server-dir: public_html/
          # 2026-07-17: multiple deploys reported "success" with zero errors but
          # never actually updated any file on the server (verified via curl —
          # unchanged Last-Modified headers and stale content after several
          # green runs). Strong suspicion: the old sync-state file on the server
          # (from before today's Hostinger account incident) is telling this
          # action every file already matches, so it uploads nothing. Forcing a
          # new state filename below makes it treat this as a first-ever deploy
          # with no prior state, so everything gets uploaded fresh. This does
          # NOT enable dangerous-clean-slate — no deletions happen, only uploads.
          state-name: .ftp-deploy-sync-state-2026-07-17.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/_stray_assets/**
            **/_archive/**
            **/*.md
            **/node_modules/**
            **/.claude/**
            **/*DRAFT*
