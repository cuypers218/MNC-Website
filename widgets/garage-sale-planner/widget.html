// sf() = "set field" — safe varargs alternative to setField; path as spread args avoids JSON-in-HTML quoting issues
let _weatherFetchTimer,_lastWeatherSaleDate;
function sf(el,...path){
  const v=el.type==="checkbox"?el.checked:el.value;
  deepSet(P,path,v);P.isDemo=false;save();
  refreshHeaderStat();refreshMetrics();
  if(path.includes("yourName")){
    refreshHeroTitle();refreshAvatarDisplay();
    const ai=document.getElementById('avatar-name-input');
    if(ai&&document.activeElement!==ai)ai.value=deepGet(P,['setup','yourName'])||'';
  }
  if(UI.tab==="start")refreshGoalProgress();
  if(UI.tab==="start"&&(path.includes("saleDate")||path.includes("backupDate")))refreshCountdown();
  if(path.includes("venmoHandle")||path.includes("cashappHandle")||path.includes("paypalHandle")||path.includes("zelleHandle"))refreshDigitalPaymentsButton();
  if(UI.tab==="start"&&path.includes("saleDate")){
    // oninput and onblur both call sf() — onblur fires again even when the date didn't
    // change (e.g. user just tabs into the zip field). Without this guard that no-op
    // edit still reschedules fetchWeather(), which re-renders the zip prompt from
    // scratch and wipes out whatever zip the user is mid-typing.
    const newDate=P.setup?.saleDate||null;
    if(newDate!==_lastWeatherSaleDate){
      _lastWeatherSaleDate=newDate;
      clearTimeout(_weatherFetchTimer);
      _weatherFetchTimer=setTimeout(()=>fetchWeather(newDate),150);
    }
    const rb=document.getElementById("reminder-btn");
    if(rb){rb.disabled=!P.setup?.saleDate;rb.textContent=P.setup?.saleDate?"Set reminder":"Set reminder (set date first)";}
  }
  if(UI.tab==="saleWrap"&&UI.section==="sale")refreshSubtotal();
  if(UI.tab==="saleWrap"&&UI.section==="wrap"&&path[0]==="wrap")refreshWrapCompletion();
}

let _calPickerPath=null,_calPickerId=null,_calPickerMonth=null;
function openDatePicker(pathStr,pickerId){

function closeDatePicker(){

  const p=document.getElementById('cal-panel');if(p)p.remove();
  _calPickerPath=null;_calPickerId=null;_calPickerMonth=null;
}
function shiftPickerMonth(delta){
  _calPickerMonth=new Date(_calPickerMonth.getFullYear(),_calPickerMonth.getMonth()+delta,1);
  renderDatePickerPanel();
}
function pickCalendarDate(y,m,d){
  const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const path=_calPickerPath,id=_calPickerId;
  sf({value:dateStr,type:'text'},...path.split("."));
  const labelEl=document.getElementById(`cal-trigger-label-${id}`);
  if(labelEl)labelEl.textContent=new Date(dateStr+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  const trigEl=document.getElementById(`cal-trigger-${id}`);
  if(trigEl)trigEl.style.color='var(--color-text)';
  closeDatePicker();
}
function renderDatePickerPanel(){
  let ov=document.getElementById('cal-overlay');
  if(!ov){
    ov=document.createElement('div');ov.id='cal-overlay';
    ov.style.cssText='position:fixed;inset:0;z-index:999';
    ov.onclick=closeDatePicker;
    document.body.appendChild(ov);
  }
  let p=document.getElementById('cal-panel');
  if(!p){p=document.createElement('div');p.id='cal-panel';p.className='cal-panel';document.body.appendChild(p);}
  const trig=document.getElementById(`cal-trigger-${_calPickerId}`);
  if(trig){
    const r=trig.getBoundingClientRect();
    p.style.top=`${r.bottom+window.scrollY+6}px`;
    p.style.left=`${Math.min(r.left+window.scrollX,window.innerWidth-272)}px`;
  }
  const y=_calPickerMonth.getFullYear(),m=_calPickerMonth.getMonth();
  const monthLabel=_calPickerMonth.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const firstDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const current=deepGet(P,_calPickerPath.split("."));
  const selected=current?current:null;
  let cells="";
  for(let i=0;i<firstDow;i++)cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const cellDate=new Date(y,m,d);cellDate.setHours(0,0,0,0);
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=cellDate.getTime()===today.getTime();
    const isSelected=iso===selected;
    cells+=`<button type="button" onclick="pickCalendarDate(${y},${m},${d})" class="cal-day${isSelected?' is-selected':''}${isToday&&!isSelected?' is-today':''}">${d}</button>`;
  }
  p.innerHTML=`
    <div class="cal-panel-header">
      <button type="button" class="cal-nav-btn" onclick="shiftPickerMonth(-1)" aria-label="Previous month">‹</button>
      <span>${monthLabel}</span>
      <button type="button" class="cal-nav-btn" onclick="shiftPickerMonth(1)" aria-label="Next month">›</button>
    </div>
    <div class="cal-panel-dow">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="cal-panel-grid">${cells}</div>
    <button type="button" class="cal-today-link" onclick="const t=new Date();pickCalendarDate(t.getFullYear(),t.getMonth(),t.getDate())">Today</button>
  `;
}

// ─── PIN SALE LOCATION ───────────────────────────────────────────────────────
function pinSaleLocation(){
  const statusEl=document.getElementById('pin-status');
  const setStatus=(msg)=>{if(statusEl){statusEl.style.display='block';statusEl.textContent=msg;}};
  if(!navigator.geolocation){setStatus("Location isn't available on this device — type your address in below.");return;}
  setStatus('Finding your location…');
  navigator.geolocation.getCurrentPosition(async(pos)=>{
    try{
      const{latitude,longitude}=pos.coords;
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&zoom=18&lat=${latitude}&lon=${longitude}`);
      const data=await res.json();
      const a=data&&data.address;
      let addr=null;let gotRoad=false;
      if(a&&a.road){
        gotRoad=true;
        const locality=a.city||a.town||a.municipality||a.village||a.hamlet||a.suburb||a.county||"";
        const stateCode=a["ISO3166-2-lvl4"]?a["ISO3166-2-lvl4"].split("-").pop():(a.state_code||a.state||"");
        addr=`${a.road}, ${locality}, ${stateCode} ${a.postcode||""}`.replace(/\s+,/g,",").replace(/\s+/g," ").trim();
      }else if(data&&data.display_name){
        const parts=data.display_name.split(",").map(p=>p.trim()).filter(p=>p&&!/^(united states|usa|us)$/i.test(p));
        addr=parts.slice(0,5).join(", ");
      }
      if(addr){

          setStatus('Street, city, and zip filled in from your location — add your house number at the start.');
        }else{
          setStatus("Couldn't find a street address here — type it in below.");
        }
      }else{
        setStatus("Couldn't find a street address here — type it in below.");
      }
    }catch(e){
      setStatus("Couldn't look up that address here — type it in below.");
    }

  if(btn){btn.disabled=true;btn.textContent="Setting reminder...";}

function refreshStickyBar(){
  const stats=getStats(P);

  const toggle=document.getElementById('scratch-toggle');

const W={data:null,loading:false,forDate:null,forZip:null,viewStart:0,latLon:null,latLonZip:null};
function wCodeInfo(c){
  if(c===0)return{label:'Clear sky',good:true};
  if(c<=2)return{label:'Partly cloudy',good:true};
  if(c<=3)return{label:'Overcast',good:true};
  if(c<=48)return{label:'Foggy',good:false};
  if(c<=67)return{label:'Rain',good:false};
  if(c<=77)return{label:'Snow',good:false};
  if(c<=82)return{label:'Rain showers',good:false};
  return{label:'Thunderstorms',good:false};
}

  if(code<=67)return wrap(`<path d="M19 15.58A4.5 4.5 0 0 0 17.5 7h-1.14A7 7 0 1 0 5 14.5" stroke="${cloud}"/><line x1="8" y1="17" x2="8" y2="22" stroke="${accent}"/><line x1="12" y1="17" x2="12" y2="22" stroke="${accent}"/><line x1="16" y1="17" x2="16" y2="22" stroke="${accent}"/>`);
  if(code<=77)return wrap(`<path d="M19 15.58A4.5 4.5 0 0 0 17.5 7h-1.14A7 7 0 1 0 5 14.5" stroke="${cloud}"/><g stroke="${accent}"><line x1="8" y1="17" x2="8" y2="17.01"/><line x1="8" y1="21" x2="8" y2="21.01"/><line x1="12" y1="19" x2="12" y2="19.01"/><line x1="12" y1="23" x2="12" y2="23.01"/><line x1="16" y1="17" x2="16" y2="17.01"/><line x1="16" y1="21" x2="16" y2="21.01"/></g>`);
  if(code<=82)return wrap(`<path d="M19 13.58A4.5 4.5 0 0 0 17.5 5h-1.14A7 7 0 1 0 5 12.5" stroke="${cloud}"/><line x1="8" y1="15" x2="7" y2="19" stroke="${accent}"/><line x1="12" y1="15" x2="11" y2="19" stroke="${accent}"/><line x1="16" y1="15" x2="15" y2="19" stroke="${accent}"/>`);
  return wrap(`<path d="M19 13.58A4.5 4.5 0 0 0 17.5 5h-1.14A7 7 0 1 0 5 12.5" stroke="${cloud}"/><polyline points="13 12 9 18 13 18 11 23" stroke="${warn}"/>`);

function shiftWeather(delta){
  if(!W.data||!W.data.days)return;
  W.viewStart=Math.max(0,Math.min(W.data.days.length-3,W.viewStart+delta));

async function geocodeZip(zip){
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(zip)}&count=1&language=en&format=json&countryCode=US`);
  const j=await r.json();
  if(!j.results||!j.results.length)throw new Error('zip_not_found');
  return{lat:j.results[0].latitude,lon:j.results[0].longitude};
}

async function fetchWeather(saleDate){
  const el=document.getElementById('weather-card');if(!el)return;
  el.style.display='';
  if(!saleDate){
    el.innerHTML=`<div class="card-title" style="margin-bottom:8px">Sale day weather</div><div style="font-size:14px;color:var(--color-text-muted);line-height:1.6">Set your sale date above and I'll pull the forecast for you.</div>`;
    return;
  }
  const zip=P.setup?.weatherZip;
  if(!zip){
    // don't redraw the prompt out from under someone actively typing their zip into it
    if(document.activeElement&&document.activeElement.id==='weather-zip-input')return;
    renderWeatherZipPrompt();return;
  }
  if(W.forDate===saleDate&&W.forZip===zip&&W.data){renderWeatherCard();return;}
  W.forDate=saleDate;W.forZip=zip;W.loading=true;W.data=null;
  el.innerHTML=`<div class="card-title">Sale day weather</div><div class="text-muted" style="font-size:var(--text-sm);margin-top:6px">Checking forecast…</div>`;
  try{
    let latLon=W.latLon;
    if(!latLon||W.latLonZip!==zip){latLon=await geocodeZip(zip);W.latLon=latLon;W.latLonZip=zip;}
    const{lat,lon}=latLon;
    const todayObj=new Date();todayObj.setHours(0,0,0,0);
    const dateObj=new Date(saleDate+'T00:00:00');
    const daysAway=Math.round((dateObj-todayObj)/86400000);
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&forecast_days=16&timezone=auto`;
    const r=await fetch(url);const j=await r.json();
    const cw=j.current_weather||{};
    const current={temp:Math.round(cw.temperature||0),code:cw.weathercode||0};
    W.loading=false;
    if(daysAway<0){W.data={current,msg:'Sale date has passed.'};renderWeatherCard();return;}
    if(daysAway>15){
      const waitDays=daysAway-15;
      W.data={current,msg:`Right now, it's ${current.temp}° and ${wCodeInfo(current.code).label.toLowerCase()} nearby. Your sale-day forecast unlocks in ${waitDays} day${waitDays===1?'':'s'}, once it's within 16 days out.`};
      renderWeatherCard();return;
    }
    const times=j.daily.time||[];
    const todayStr=todayObj.toISOString().split('T')[0];
    const salei=times.indexOf(saleDate)>=0?times.indexOf(saleDate):Math.min(daysAway,times.length-1);
    const days=times.map((date,idx)=>{
      const d=new Date(date+'T00:00:00');
      return{date,day:d.toLocaleDateString('en-US',{weekday:'short'}),dateNum:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),
        code:j.daily.weathercode[idx],high:Math.round(j.daily.temperature_2m_max[idx]),low:Math.round(j.daily.temperature_2m_min[idx]),
        rain:j.daily.precipitation_probability_max[idx],isToday:date===todayStr,isSaleDay:idx===salei};
    });
    W.viewStart=Math.max(0,salei-1);
    W.data={current,days,saleDay:days[salei]};
  }catch(e){
    W.loading=false;
    W.data={msg:e.message==='zip_not_found'?'Zip code not found — try a nearby zip.':'Could not load forecast. Check your connection.',zipError:true};
  }
  renderWeatherCard();
}
function renderWeatherCard(){
  const el=document.getElementById('weather-card');if(!el)return;
  if(!W.data){el.innerHTML=`<div class="card-title">Sale day weather</div><div class="text-muted" style="font-size:var(--text-sm);margin-top:6px">Checking forecast…</div>`;return;}
  if(W.data.msg){
    const c=W.data.current;
    const header=c?`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">Sale day weather</div>
      <div style="display:flex;align-items:center;gap:6px" title="${wCodeInfo(c.code).label}">
        ${weatherIconSvg(c.code,24)}
        <span style="font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--color-text)">${c.temp}°</span>
        <span style="font-size:11px;color:var(--color-text-muted)">now</span>
      </div>
    </div>`:`<div class="card-title">Sale day weather</div>`;
    el.innerHTML=`${header}<div class="text-muted" style="font-size:var(--text-sm);margin-top:6px">${W.data.msg}</div>${W.data.zipError?'<button onclick="clearWeatherZip()" style="margin-top:8px;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--color-primary-text);background:none;border:none;cursor:pointer;padding:0">Try a different zip →</button>':''}`;
    return;
  }
  const cur=W.data.current;
  const curInfo=wCodeInfo(cur.code);
  const sd=W.data.saleDay;
  const sdInfo=wCodeInfo(sd.code);
  const good=sdInfo.good&&sd.rain<40;
  const dotColor=good?'#C4B0E8':'#F5C4A8';
  const indicatorBg=good?'#F9ECF0':'#F5C4A8';
  const indicatorText=good?'Good sale weather'
    :sd.rain>=40?`Heads up — rain ${sd.day}`
    :`Heads up — ${sdInfo.label.toLowerCase()} ${sd.day}`;
  const days=W.data.days;
  const vs=W.viewStart;
  const visible=days.slice(vs,vs+3);
  const canLeft=vs>0;
  const canRight=vs+3<days.length;
  const arrowBtn=(dir,enabled)=>`<button onclick="shiftWeather(${dir})" style="background:none;border:1.5px solid ${enabled?'#C44570':'#F5C4A8'};width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:${enabled?'pointer':'default'};color:${enabled?'#C44570':'#8BA7D4'};font-size:14px;flex-shrink:0" ${enabled?'':'disabled'}>${dir<0?'‹':'›'}</button>`;
  const stripHTML=visible.map(d=>{
    const info=wCodeInfo(d.code);
    const highlight=d.isSaleDay?'background:#F9ECF0;':'';
    const labelColor=d.isSaleDay?'var(--color-primary)':d.isToday?'var(--color-text)':'var(--color-text-muted)';
    const topLabel=d.isToday&&!d.isSaleDay?'Today':d.isSaleDay?`${d.day} — SALE`:d.day;
    return`<div style="flex:1;text-align:center;padding:10px 4px;${highlight}">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:${labelColor};margin-bottom:2px">${topLabel}</div>
      <div style="font-size:10px;color:${d.isSaleDay?'var(--color-primary)':'var(--color-text-muted)'};margin-bottom:6px">${d.dateNum}</div>
      <div style="display:flex;justify-content:center;margin-bottom:6px" title="${info.label}">${weatherIconSvg(d.code,26)}</div>
      <div style="font-size:13px;font-weight:700;color:var(--color-text)">${d.high}°</div>
      <div style="font-size:11px;color:var(--color-text-muted)">${d.low}°</div>
      <div style="font-size:10px;color:${d.rain>=40?'#F5C4A8':'var(--color-text-muted)'};margin-top:3px">${d.rain}% rain</div>
    </div>`;
  }).join('');
  el.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">Sale day weather</div>
      <div style="display:flex;align-items:center;gap:6px" title="${curInfo.label}">
        ${weatherIconSvg(cur.code,24)}
        <span style="font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--color-text)">${cur.temp}°</span>
        <span style="font-size:11px;color:var(--color-text-muted)">now</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
      ${arrowBtn(-1,canLeft)}
      <div style="display:flex;flex:1;gap:4px">${stripHTML}</div>
      ${arrowBtn(1,canRight)}
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:9px 13px;background:${indicatorBg}">
      <div style="width:9px;height:9px;background:${dotColor};flex-shrink:0"></div>
      <span style="font-size:13px;font-weight:600;color:var(--color-text)">${indicatorText}</span>
    </div>
    ${!good?`<div style="margin-top:10px;font-size:13px;color:var(--color-text-muted);line-height:1.6">Rain's looking likely. Worth having a backup date in your pocket.</div>`:""}
    <div style="margin-top:10px;text-align:right"><button onclick="clearWeatherZip()" style="font-family:var(--font-body);font-size:11px;color:var(--color-text-muted);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline">Change zip</button></div>
    `;
  checkWeatherNotif();
}

function openTour(){
  _tourStep=-1;
  const ov=document.getElementById('tour-overlay');
  if(!ov)return;
  ov.style.display='block';
  ov.style.opacity='0';
  renderTourStep();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ov.style.opacity='1';}));
}
function closeTour(){
  const ov=document.getElementById('tour-overlay');
  if(ov){ov.style.opacity='0';setTimeout(()=>{ov.style.display='none';ov.innerHTML='';},180);}
  const scrim=document.getElementById('tour-scrim');
  if(scrim)scrim.style.display='none';
  _clearTourSpotlight();
}
function finishTour(){
  localStorage.setItem(TOUR_KEY,'true');
  closeTour();
}
function skipTour(){finishTour();}
function jumpIn(){finishTour();}
function startSpotlightTour(){_tourStep=0;renderTourStep();}
function nextTourStep(){
  _tourStep=Math.min(_tourStep+1,tourSpotlightSteps.length);
  renderTourStep();
}
function _clearTourSpotlight(){
  const nav=document.getElementById('main-nav');
  if(nav)Array.from(nav.children).forEach(b=>b.classList.remove('tour-spotlight-tab'));
}
function renderTourStep(){
  const ov=document.getElementById('tour-overlay');
  const scrim=document.getElementById('tour-scrim');
  if(!ov)return;
  _clearTourSpotlight();

  if(_tourStep===-1){
    if(scrim)scrim.style.display='none';
    ov.style.pointerEvents='auto';
    ov.innerHTML=`
    <div style="position:absolute;inset:0;background:rgba(37,37,53,0.75);display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="background:#FAF7ED;border-radius:var(--radius-xl);max-width:480px;width:100%;padding:36px 32px;text-align:center">
        <p style="font-family:var(--font-body);font-size:16px;color:#252535;line-height:1.6;margin-bottom:26px">I built this so nothing gets missed. Let me show you where everything lives.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button onclick="startSpotlightTour()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:#252535;color:#FAF7ED;border:none;padding:13px 26px;cursor:pointer">Show me around</button>
          <button onclick="jumpIn()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:transparent;color:#252535;border:1.5px solid #252535;padding:13px 26px;cursor:pointer">Jump in</button>
        </div>
      </div>
    </div>`;
    return;
  }

  if(_tourStep<tourSpotlightSteps.length){
    const step=tourSpotlightSteps[_tourStep];
    if(scrim)scrim.style.display='block';
    ov.style.pointerEvents='none';
    const nav=document.getElementById('main-nav');
    const tabBtn=nav?nav.children[step.tabIdx]:null;
    if(tabBtn)tabBtn.classList.add('tour-spotlight-tab');
    const isLast=_tourStep===tourSpotlightSteps.length-1;

    const cardW=320;
    const vw=window.innerWidth;
    let top=120,left=16;
    if(tabBtn){
      const r=tabBtn.getBoundingClientRect();
      top=r.bottom+10;
      left=r.left;
    }
    if(left+cardW+16>vw)left=Math.max(16,vw-cardW-16);
    if(left<16)left=16;

    ov.innerHTML=`
    <div style="position:absolute;top:${top}px;left:${left}px;width:${cardW}px;max-width:calc(100vw - 32px);background:#FAF7ED;border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:18px 20px;pointer-events:auto">
      <div style="font-family:var(--font-body);font-size:12px;color:#426DB3;margin-bottom:8px">Step ${_tourStep+1} of 5</div>
      <div style="font-family:var(--font-body);font-size:14px;color:#252535;line-height:1.55;margin-bottom:16px">${esc(step.body)}</div>
      <div style="display:flex;align-items:center;gap:16px">
        <button onclick="nextTourStep()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:#252535;color:#FAF7ED;border:none;padding:9px 20px;cursor:pointer">${isLast?'Got it':'Next'}</button>
        <button onclick="skipTour()" style="font-family:var(--font-body);font-size:13px;color:#426DB3;background:none;border:none;cursor:pointer;padding:0">Skip tour</button>
      </div>
    </div>`;
    return;
  }

  // Closing card
  if(scrim)scrim.style.display='none';
  ov.style.pointerEvents='auto';
  ov.innerHTML=`
  <div style="position:absolute;inset:0;background:rgba(37,37,53,0.75);display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="background:#FAF7ED;max-width:480px;width:100%;padding:36px 32px;text-align:center">
      <p style="font-family:var(--font-body);font-size:16px;color:#252535;line-height:1.6;margin-bottom:26px">That's it. Everything saves automatically as you go.</p>
      <button onclick="finishTour()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:#252535;color:#FAF7ED;border:none;padding:13px 26px;cursor:pointer">Got it</button>
    </div>
  </div>`;
}

// ─── QUICK-CAPTURE SCRATCH PAD ────────────────────────────────────────────────
let _scratchTimer;
function toggleScratchPad(){
  if(UI.scratchOpen)closeScratchPad();else openScratchPad();
}
function openScratchPad(){
  UI.scratchOpen=true;UI.scratchNoteId=null;
  const panel=document.getElementById('scratch-panel');
  const btn=document.getElementById('scratch-toggle');
  if(!panel||!btn)return;
  panel.style.display='block';
  btn.setAttribute('aria-expanded','true');
  renderScratchPanel();
}
function closeScratchPad(){
  flushScratchNote();
  UI.scratchOpen=false;UI.scratchNoteId=null;
  const panel=document.getElementById('scratch-panel');
  const btn=document.getElementById('scratch-toggle');
  if(panel)panel.style.display='none';
  if(btn)btn.setAttribute('aria-expanded','false');
}
function scratchPreview(note){
  const t=(note.text||'').trim();
  if(!t)return'Empty note';
  const firstLine=t.split('\n')[0];
  return firstLine.length>60?firstLine.slice(0,60)+'…':firstLine;
}
function renderScratchPanel(){
  const panel=document.getElementById('scratch-panel');if(!panel)return;
  const notes=P.scratchNotes||[];
  if(UI.scratchNoteId){
    const note=notes.find(n=>n.id===UI.scratchNoteId);
    if(!note){UI.scratchNoteId=null;renderScratchPanel();return;}
    panel.innerHTML=`
      <div class="scratch-header">
        <div style="display:flex;align-items:center;gap:6px">
          <span id="scratch-drag-handle" title="Drag to move">⠿⠿</span>
          <button class="scratch-back" onclick="backToScratchList()">← All notes</button>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <button class="scratch-clear" onclick="deleteScratchNote('${note.id}')">Delete</button>
          <button class="scratch-close" onclick="closeScratchPad()" aria-label="Close quick notes">×</button>
        </div>
      </div>
      <textarea id="scratch-textarea" placeholder="Jot something down before you lose it..." oninput="onScratchNoteInput(this.value)">${esc(note.text||'')}</textarea>
      <div class="scratch-footer">
        <span class="scratch-status" id="scratch-status">Saved to this browser</span>
      </div>`;
    const ta=document.getElementById('scratch-textarea');
    if(ta){ta.focus();const len=ta.value.length;ta.setSelectionRange(len,len);}
    return;
  }
  const listHTML=notes.length?notes.map(n=>`
    <div class="scratch-note-item" onclick="openScratchNote('${n.id}')">
      <div style="flex:1;min-width:0">
        <div class="scratch-note-preview">${esc(scratchPreview(n))}</div>
        <div class="scratch-note-date">${new Date(n.updatedAt).toLocaleDateString()}</div>
      </div>
      <button class="scratch-note-delete" onclick="event.stopPropagation();deleteScratchNote('${n.id}')" aria-label="Delete note">×</button>
    </div>`).join(''):`<div class="scratch-empty">No notes yet — tap "+ New note" to jot something down.</div>`;
  panel.innerHTML=`
    <div class="scratch-header">
      <div style="display:flex;align-items:center;gap:6px">
        <span id="scratch-drag-handle" title="Drag to move">⠿⠿</span>
        <span>Quick notes</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="scratch-clear" onclick="openHelp('quick-notes-move')" aria-label="Help — moving this panel" title="Help">?</button>
        <button class="scratch-close" onclick="closeScratchPad()" aria-label="Close quick notes">×</button>
      </div>
    </div>
    <div class="scratch-list">${listHTML}</div>
    <button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px" onclick="newScratchNote()">+ New note</button>`;
}
function newScratchNote(){
  const note={id:makeId(),text:'',updatedAt:Date.now()};
  P.scratchNotes=[note,...(P.scratchNotes||[])];
  save();
  UI.scratchNoteId=note.id;
  renderScratchPanel();
}
function openScratchNote(id){
  flushScratchNote();
  UI.scratchNoteId=id;
  renderScratchPanel();
}
function backToScratchList(){
  flushScratchNote();
  UI.scratchNoteId=null;
  renderScratchPanel();
}
function onScratchNoteInput(v){
  setScratchStatus('Typing…');
  clearTimeout(_scratchTimer);
  _scratchTimer=setTimeout(()=>{
    const note=(P.scratchNotes||[]).find(n=>n.id===UI.scratchNoteId);
    if(note){note.text=v;note.updatedAt=Date.now();save();setScratchStatus('Saved to this browser');}
  },500);
}
function flushScratchNote(){
  clearTimeout(_scratchTimer);
  if(!UI.scratchNoteId)return;
  const ta=document.getElementById('scratch-textarea');
  const note=(P.scratchNotes||[]).find(n=>n.id===UI.scratchNoteId);
  if(ta&&note&&note.text!==ta.value){note.text=ta.value;note.updatedAt=Date.now();save();}
}
function setScratchStatus(msg){
  const el=document.getElementById('scratch-status');
  if(el)el.textContent=msg;
}
function deleteScratchNote(id){
  mncConfirm("Delete this note?",()=>{
    P.scratchNotes=(P.scratchNotes||[]).filter(n=>n.id!==id);
    save();
    if(UI.scratchNoteId===id)UI.scratchNoteId=null;
    renderScratchPanel();
  });
}
window.addEventListener('beforeunload',flushScratchNote);

(function initScratchDrag(){
  const POS_KEY='mnc-scratch-pos';
  let dragging=false,startX=0,startY=0,startLeft=0,startBottom=0,panelEl=null;

  function clamp(val,min,max){return Math.min(Math.max(val,min),max);}

  function applyPos(panel,left,bottom){
    const w=panel.offsetWidth||300,h=panel.offsetHeight||200;
    const maxLeft=window.innerWidth-w-8;
    const maxBottom=window.innerHeight-h-8;
    left=clamp(left,8,Math.max(8,maxLeft));
    bottom=clamp(bottom,8,Math.max(8,maxBottom));
    panel.style.left=left+'px';
    panel.style.right='auto';
    panel.style.bottom=bottom+'px';
    return{left,bottom};
  }

  function savePos(left,bottom){
    try{localStorage.setItem(POS_KEY,JSON.stringify({left,bottom}));}catch(e){}
  }
  function restorePos(panel){
    try{
      const raw=localStorage.getItem(POS_KEY);
      if(!raw)return;
      const pos=JSON.parse(raw);
      if(pos&&typeof pos.left==='number'&&typeof pos.bottom==='number'){
        applyPos(panel,pos.left,pos.bottom);
      }
    }catch(e){}
  }

  function pointerXY(e){
    if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
    if(e.changedTouches&&e.changedTouches.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
    return{x:e.clientX,y:e.clientY};
  }

  function onDragStart(e){
    const handle=e.target.closest&&e.target.closest('#scratch-drag-handle');
    if(!handle)return;
    panelEl=document.getElementById('scratch-panel');
    if(!panelEl)return;
    const rect=panelEl.getBoundingClientRect();
    const xy=pointerXY(e);
    dragging=true;
    startX=xy.x;startY=xy.y;
    startLeft=rect.left;
    startBottom=window.innerHeight-rect.bottom;
    panelEl.classList.add('is-dragging');
    e.preventDefault();
  }
  function onDragMove(e){
    if(!dragging||!panelEl)return;
    const xy=pointerXY(e);
    const dx=xy.x-startX;
    const dy=xy.y-startY;
    applyPos(panelEl,startLeft+dx,startBottom-dy);
    e.preventDefault();
  }
  function onDragEnd(){
    if(!dragging||!panelEl)return;
    dragging=false;
    panelEl.classList.remove('is-dragging');
    const rect=panelEl.getBoundingClientRect();
    const left=rect.left;
    const bottom=window.innerHeight-rect.bottom;
    savePos(left,bottom);
    panelEl=null;
  }

  document.addEventListener('mousedown',onDragStart);
  document.addEventListener('mousemove',onDragMove);
  document.addEventListener('mouseup',onDragEnd);
  document.addEventListener('touchstart',onDragStart,{passive:false});
  document.addEventListener('touchmove',onDragMove,{passive:false});
  document.addEventListener('touchend',onDragEnd);

  const _origOpenScratchPad=window.openScratchPad;
  window.openScratchPad=function(){
    _origOpenScratchPad();
    const panel=document.getElementById('scratch-panel');
    if(panel)restorePos(panel);
  };
})();

// ─── QUICK NOTES BUTTON DRAG (move the circle itself, no need to open it) ─────
(function initScratchButtonDrag(){
  const BTN_POS_KEY='mnc-scratch-btn-pos';
  const DRAG_THRESHOLD=6;
  let pressing=false,moved=false,justDragged=false;
  let startX=0,startY=0,startLeft=0,startBottom=0,btnEl=null;

  function clamp(val,min,max){return Math.min(Math.max(val,min),max);}

  function applyBtnPos(btn,left,bottom){
    const w=btn.offsetWidth||44,h=btn.offsetHeight||44;
    const maxLeft=window.innerWidth-w-8;
    const maxBottom=window.innerHeight-h-8;
    left=clamp(left,8,Math.max(8,maxLeft));
    bottom=clamp(bottom,8,Math.max(8,maxBottom));
    btn.style.left=left+'px';
    btn.style.right='auto';
    btn.style.bottom=bottom+'px';
    return{left,bottom};
  }
  function saveBtnPos(left,bottom){
    try{localStorage.setItem(BTN_POS_KEY,JSON.stringify({left,bottom}));}catch(e){}
  }
  function restoreBtnPos(btn){
    try{
      const raw=localStorage.getItem(BTN_POS_KEY);
      if(!raw)return;
      const pos=JSON.parse(raw);
      if(pos&&typeof pos.left==='number'&&typeof pos.bottom==='number'){
        applyBtnPos(btn,pos.left,pos.bottom);
      }
    }catch(e){}
  }
  function pointerXY(e){
    if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
    if(e.changedTouches&&e.changedTouches.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
    return{x:e.clientX,y:e.clientY};
  }

  function onPressStart(e){
    const btn=e.target.closest&&e.target.closest('#scratch-toggle');
    if(!btn)return;
    btnEl=btn;
    const rect=btn.getBoundingClientRect();
    const xy=pointerXY(e);
    pressing=true;moved=false;
    startX=xy.x;startY=xy.y;
    startLeft=rect.left;
    startBottom=window.innerHeight-rect.bottom;
  }
  function onPressMove(e){
    if(!pressing||!btnEl)return;
    const xy=pointerXY(e);
    const dx=xy.x-startX,dy=xy.y-startY;
    if(!moved&&Math.hypot(dx,dy)>DRAG_THRESHOLD){
      moved=true;
      btnEl.classList.add('is-dragging');
    }
    if(moved){
      applyBtnPos(btnEl,startLeft+dx,startBottom-dy);
      e.preventDefault();
    }
  }
  function onPressEnd(){
    if(!pressing||!btnEl)return;
    pressing=false;
    if(moved){
      btnEl.classList.remove('is-dragging');
      const rect=btnEl.getBoundingClientRect();
      saveBtnPos(rect.left,window.innerHeight-rect.bottom);
      justDragged=true;
    }
    moved=false;
    btnEl=null;
  }

  document.addEventListener('mousedown',onPressStart);
  document.addEventListener('mousemove',onPressMove);
  document.addEventListener('mouseup',onPressEnd);
  document.addEventListener('touchstart',onPressStart,{passive:true});
  document.addEventListener('touchmove',onPressMove,{passive:false});
  document.addEventListener('touchend',onPressEnd);

  function wireToggleBtn(){
    const toggleBtn=document.getElementById('scratch-toggle');
    if(!toggleBtn)return;
    restoreBtnPos(toggleBtn);
    toggleBtn.addEventListener('click',function(e){
      if(justDragged){justDragged=false;e.preventDefault();e.stopPropagation();return;}
      toggleScratchPad();
    });
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',wireToggleBtn);
  }else{
    wireToggleBtn();
  }
})();
