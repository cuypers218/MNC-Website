// Quick-add (2026-09 shape): parses a line like "shirts 3 for $5" or "lamp $8" into
// a real item without the full guided-sort flow. Deliberately tolerant, not exact —
// on anything ambiguous it still creates the item (name always wins), just without
// a price/quantity guess it isn't sure of, so nothing she types is ever dropped.
function parseQuickAdd(raw){
  let s=String(raw||'').trim();
  if(!s)return null;
  let price='',qty='';
  const priceMatch=s.match(/\$\s*(\d+(?:\.\d{1,2})?)/)||s.match(/\bfor\s+(\d+(?:\.\d{1,2})?)\b/i);
  if(priceMatch){price=priceMatch[1];s=s.slice(0,priceMatch.index)+s.slice(priceMatch.index+priceMatch[0].length);}
  const qtyMatch=s.match(/\b(\d+)\b/);
  if(qtyMatch){qty=qtyMatch[1];s=s.slice(0,qtyMatch.index)+s.slice(qtyMatch.index+qtyMatch[0].length);}
  const name=s.replace(/\bfor\b/gi,' ').replace(/\s{2,}/g,' ').trim().replace(/^[\s,.\-]+|[\s,.\-]+$/g,'');
  if(!name)return null;
  return{name,qty:qty?String(Math.max(1,parseInt(qty,10))):'1',price:price?String(nn(price)):''};
}

function gsPriceLookup(categoryKey,itemName,brandDetected,condition){
  const cat=sortPriceCategories.find(x=>x.key===categoryKey);
  if(!cat)return{price:0,nudge:false,caution:null,matched:false};
  const idx=condition==='Excellent'?0:(condition==='Fair'?2:1);
  const row=cat.items.find(x=>x.name===itemName);
  let price=0;
  if(row)price=row.price[idx];
  else if(brandDetected&&cat.brandTier)price=cat.brandTier[idx];
  const nudge=!!cat.alwaysNudge||!!brandDetected||price>=SORT_PRICE_NUDGE_THRESHOLD;
  const nudgeReason=cat.alwaysNudge?'category':(brandDetected?'brand':(price>=SORT_PRICE_NUDGE_THRESHOLD?'price':null));
  return{price,nudge,nudgeReason,caution:(row&&row.caution)||null,matched:true};
}

function addItem(){
  if(!draft.item.name.trim())return;
  const qty=Number(draft.item.quantity);if(isNaN(qty)||qty<1)draft.item.quantity="1";
  const pr=Number(draft.item.price);if(isNaN(pr)||pr<0)draft.item.price="";
  const d=draft.item;
  const suggested=priceRange(d.category,d.condition);
  const platform=suggestPlatform(d.category,d.condition,d.price,d.decision);
  P.items=(P.items||[]).map(i=>i.id===d.id?{...i,name:d.name,category:d.category,condition:d.condition,quantity:d.quantity,decision:d.decision,price:d.price,notes:d.notes,suggested,platform}:i);
  P.isDemo=false;save();draft.item={id:null,name:"",category:"Decor",condition:"Good",quantity:"1",decision:"Garage Sale",price:"",notes:""};

function heartBtnHtml(item){
  const inMem=(P.items||[]).some(i=>i.decision==='Memory Box'&&i.linkedFrom===item.id);

  const item=(P.items||[]).find(i=>i.id===id);if(!item)return;

function addBatch(){
  const d=draft.batch;
  const existing=P.batchItems||[];
  if(d.id){
    P.batchItems=existing.map(b=>b.id===d.id?{...b,type:d.type,price:d.price,description:d.description}:b);
    (P.items||[]).forEach(i=>{if(i.batchId===d.id)i.price=d.price;});
  }else{
    P.batchItems=[{id:makeId(),type:d.type,title:"",price:d.price,category:"",description:d.description,photo:"",createdAt:new Date().toLocaleDateString()},...existing];
  }
  P.isDemo=false;save();draft.batch={id:null,type:"Table",price:"2",description:""};renderContent();
}
function editBatch(id){
  const b=(P.batchItems||[]).find(x=>x.id===id);if(!b)return;

function deleteBatch(id){mncConfirm("Remove this batch?",()=>{P.batchItems=(P.batchItems||[]).filter(b=>b.id!==id);(P.items||[]).forEach(i=>{if(i.batchId===id)i.batchId=null;});P.isDemo=false;save();renderContent()})}

document.addEventListener('click',(e)=>{
  const pop=document.getElementById('pricing-pop');
  const btn=document.getElementById('pricing-btn');
  if(!pop||!pop.classList.contains('open'))return;
  // pop's own content can be replaced mid-click by the same handler that fires this
  // listener (e.g. tapping "Just show me the price list" swaps the popover's innerHTML) —
  // by the time this bubbles up, e.target may already be detached, so pop.contains(e.target)
  // would wrongly read false. composedPath() is captured at dispatch time, before any of
  // that mutation, so it stays accurate.
  const path=e.composedPath?e.composedPath():[];
  if(path.includes(pop)||path.includes(btn))return;
  closePricingPop();
});

// Date/address are read live from P.setup each render/refresh (no snapshot taken at
// "build" time) — so there is no stale-date state to flag; if a snapshot model is
// added later, this is where the "[sale date may have changed]" note would go.
function buildAdOutputLines(){
  const ab=P.sellPromote?.adBuilder||{};const s=P.setup||{};
  const dateLabel=ab.date?ab.date:(s.saleDate?new Date(s.saleDate+"T00:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}):"");
  const addressVal=ab.address||s.address||"";
  const lines=["GARAGE SALE"+(dateLabel?" — "+dateLabel:"")];
  if(ab.startTime||ab.endTime)lines.push(`${ab.startTime||""}${ab.startTime&&ab.endTime?"–":""}${ab.endTime||""}`);
  if(addressVal)lines.push(addressVal);
  lines.push("");
  if(ab.highlights)lines.push(ab.highlights);
  const extras=[];
  if(ab.rainOrShine)extras.push("Rain or shine.");
  if(ab.noEarlyBirds)extras.push("No early birds please.");
  if(ab.multiFamily)extras.push("Multi-family sale!");
  if(ab.includePhone&&ab.phone)extras.push(ab.phone);
  if(extras.length){lines.push("");extras.forEach(e=>lines.push(e));}
  return lines;
}
function adBuilderHasOutput(){
  const ab=P.sellPromote?.adBuilder||{};const s=P.setup||{};
  return!!(ab.highlights||ab.startTime||ab.endTime||ab.date||ab.address||s.saleDate||s.address);
}

function numWord(n){
  const words=["zero","one","two","three","four","five","six","seven","eight","nine","ten",
    "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const tens=["","","twenty","thirty","forty","fifty","sixty"];
  if(n<0||n>60)return String(n);
  if(n<20)return words[n];
  const t=Math.floor(n/10),r=n%10;
  return r?`${tens[t]}-${words[r]}`:tens[t];
}
function computeBankStack(itemCount){
  const n=Math.max(10,Math.min(300,Number(itemCount)||50));
  const scale=Math.max(1,Math.round(n/50));
  const tens=Math.min(8,2*scale);
  const fives=Math.min(16,4*scale);
  const ones=Math.min(60,20*scale);
  const quarterRolls=Math.max(1,Math.min(4,Math.ceil(n/75)));
  const total=tens*10+fives*5+ones*1+quarterRolls*10;
  return{tens,fives,ones,quarterRolls,total};
}
function printBankScript(){
  const n=Number(P.safety?.changeItemCount)||50;
  const stack=computeBankStack(n);
  document.getElementById('print-inner').innerHTML=`
    <div style="padding:32px;font-family:'DM Sans',sans-serif;max-width:520px">
      <div style="font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--color-primary-text);margin-bottom:14px">My Nest Chapter · Bank Script</div>
      <div style="font-family:'Lora',serif;font-size:20px;font-weight:700;color:#262624;margin-bottom:18px">What to ask for at the bank</div>
      <div style="font-size:14px;color:#262624;line-height:2;margin-bottom:18px">
        <div>${numWord(stack.tens)} ($${stack.tens*10} in ten-dollar bills)</div>
        <div>${numWord(stack.fives)} ($${stack.fives*5} in five-dollar bills)</div>
        <div>${numWord(stack.ones)} ($${stack.ones} in one-dollar bills)</div>
        <div>${numWord(stack.quarterRolls)} roll${stack.quarterRolls===1?'':'s'} of quarters ($${stack.quarterRolls*10} in quarters)</div>
      </div>
      <div style="font-size:15px;font-weight:700;color:#262624;border-top:1px solid #D9C7AC;padding-top:12px">Estimated cash on hand: $${stack.total}</div>
    </div>`;
  document.getElementById('print-section').style.display='block';
  window.print();
  setTimeout(()=>document.getElementById('print-section').style.display='none',2000);
}

function lhCompute(){
  const lh=UI.lhDrop||(UI.lhDrop={price:'',drop:null,custom:''});
  const orig=Number(lh.price||0);
  let newPrice=null;
  if(orig>0){
    if(lh.drop==='half')newPrice=orig/2;
    else if(lh.drop){const d=lh.drop==='custom'?Number(lh.custom||0):Number(lh.drop);if(d>0)newPrice=Math.max(0,orig-d);}
  }
  return{lh,orig,newPrice};
}
function lhRefresh(){
  const resultWrap=document.getElementById('lh-result-wrap');
  if(!resultWrap)return;
  const{lh,orig,newPrice}=lhCompute();
  document.getElementById('lh-custom-wrap').style.display=lh.drop==='custom'?'':'none';
  const emptyPrompt=document.getElementById('lh-empty-prompt');
  const logBtn=document.getElementById('lh-log-btn');
  if(newPrice!==null){
    resultWrap.style.display='';emptyPrompt.style.display='none';logBtn.style.display='';
    document.getElementById('lh-newprice').textContent='$'+newPrice.toFixed(2);
    document.getElementById('lh-sub').textContent=lh.drop==='half'?('Half of $'+orig.toFixed(2)):('$'+(lh.drop==='custom'?Number(lh.custom||0):Number(lh.drop)).toFixed(2)+' off the ask');
  }else{
    resultWrap.style.display='none';emptyPrompt.style.display='';logBtn.style.display='none';
  }
}
function lhUpdate(field,val){
  if(!UI.lhDrop)UI.lhDrop={price:'',drop:null,custom:''};
  UI.lhDrop[field]=(field==='price'||field==='custom')?String(nn(val)):val;
  lhRefresh();
}
function lhToggleDrop(d){
  if(!UI.lhDrop)UI.lhDrop={price:'',drop:null,custom:''};
  UI.lhDrop.drop=UI.lhDrop.drop===d?null:d;
  document.querySelectorAll('#lh-drop-btns button').forEach(b=>{
    const active=b.getAttribute('data-drop')===UI.lhDrop.drop;
    b.classList.toggle('btn-primary',active);b.classList.toggle('btn-secondary',!active);
  });
  lhRefresh();
}
function logLastHourSale(){
  const{lh,orig,newPrice}=lhCompute();
  if(!orig||!lh.drop)return;
  if(!newPrice||newPrice<=0)return;
  UI.lhDrop={price:'',drop:null,custom:''};
  logSale('Last hour drop',newPrice,UI.calcPaymentMethod||'Cash');
}
function addBundleItem(){
  const el=document.getElementById('bundle-price-input');
  const v=Number((el||{}).value||0);
  if(!v||v<=0)return;
  if(!UI.bundleItems)UI.bundleItems=[];

function removeBundleItem(i){
  if(!UI.bundleItems)return;

function bundleDiscount(pct){UI.bundleDiscountPct=(UI.bundleDiscountPct===pct)?null:pct;renderContent();}
function logBundleSale(){
  const items=UI.bundleItems||[];if(!items.length)return;
  const subtotal=items.reduce((s,p)=>s+p,0);
  const pct=UI.bundleDiscountPct||0;

function haggleCalc(pct){
  if(pct!==undefined)UI.haggleLastPct=pct;
  pct=UI.haggleLastPct;
  const priceEl=document.getElementById('haggle-price');
  const price=Number((priceEl||{}).value||0);

  if(!result)return;
  if(!price||price<0||!pct){result.style.display='none';return;}
  const giveUp=price*(pct/100);
  const offer=price-giveUp;
  document.getElementById('haggle-offer').textContent='$'+offer.toFixed(2);
  document.getElementById('haggle-giveup').textContent="you're giving up $"+giveUp.toFixed(2);
  result.style.display='block';
}

function setGivenAmount(v){
  const el=document.getElementById('change-given');
  if(el){el.value=v;calcChange();}
}

function denomBreakdown(amount){
  let cents=Math.round(amount*100);
  const denoms=[[10000,"Hundred"],[5000,"Fifty"],[2000,"Twenty"],[1000,"Ten"],[500,"Five"],[100,"One"],[25,"Quarter"],[10,"Dime"],[5,"Nickel"],[1,"Penny"]];
  const parts=[];
  for(const [c,label] of denoms){
    const count=Math.floor(cents/c);
    if(count>0){parts.push(`${count} ${label}${count>1?"s":""}`);cents-=count*c;}
  }
  return parts;
}

function calcChange(){
  const givenEl=document.getElementById('change-given');
  const given=Number((givenEl||{}).value||0);
  const sub=calcSubtotal(P.calculatorRows);
  const result=document.getElementById('change-result');
  const amt=document.getElementById('change-amount');
  const denomEl=document.getElementById('change-denom');
  if(!result||!amt)return;
  if(!given||given<0){result.style.display='none';return;}
  if(given<sub){
    result.style.display='block';
    result.style.background='#D9C7AC';
    amt.style.color='#262624';
    amt.textContent='Short by $'+(sub-given).toFixed(2);
    if(denomEl)denomEl.textContent='';
    return;
  }
  const change=given-sub;
  result.style.display='block';
  result.style.background='#EFE8DC';
  amt.style.color='var(--color-text)';
  amt.textContent='$'+change.toFixed(2);
  if(denomEl){
    const parts=change>0?denomBreakdown(change):[];
    denomEl.textContent=parts.length?('Give back: '+parts.join(' + ')):'';
  }
}

function updateCalcRow(id,k,v){const row=(P.calculatorRows||[]).find(r=>r.id===id);if(row){if(k==='price'&&(isNaN(Number(v))||Number(v)<0))v='0';if(k==='quantity'&&(isNaN(Number(v))||Number(v)<1))v='1';row[k]=v;P.isDemo=false;save();refreshSubtotal()}}
function updateCalcRowLive(id,k,v){updateCalcRow(id,k,v)}
function addCalcRow(){P.calculatorRows=[...(P.calculatorRows||[]),{id:makeId(),name:"",quantity:"1",price:""}];P.isDemo=false;save();renderContent()}
function removeCalcRow(id){if((P.calculatorRows||[]).length<=1)return;P.calculatorRows=(P.calculatorRows||[]).filter(r=>r.id!==id);P.isDemo=false;save();renderContent()}
function clearCalc(){P.calculatorRows=[{id:makeId(),name:"",quantity:"1",price:""}];P.isDemo=false;save();renderContent()}
function addCalcToSales(){
  const sub=calcSubtotal(P.calculatorRows);if(!sub)return;
  const method=UI.calcPaymentMethod||"Cash";
  const desc=(P.calculatorRows||[]).map(r=>r.name).filter(Boolean).join(", ")||"Calculator sale";
  P.calculatorRows=[{id:makeId(),name:"",quantity:"1",price:""}];
  logSale(desc,sub,method);
}
function logSale(desc,amt,method){
  if(!Number(amt)||Number(amt)<=0)return;
  const now=new Date();
  const time=now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  P.transactions=[{id:makeId(),description:desc||"Garage sale purchase",amount:Number(amt).toFixed(2),method,time,timestamp:now.toISOString()},...(P.transactions||[])];
  P.isDemo=false;save();checkGoalNotifs();refreshHeaderStat();renderContent();
}
function logQuickSale(){
  const d=draft.sale;
  if(!Number(d.amount))return;
  logSale(d.description,d.amount,d.method||"Cash");
  draft.sale={description:"",amount:"",method:"Cash"};
  const desc=document.getElementById("qs-desc");const amt=document.getElementById("qs-amt");
  if(desc)desc.value="";if(amt)amt.value="";
}
function deleteSale(id){P.transactions=(P.transactions||[]).filter(t=>t.id!==id);P.isDemo=false;save();refreshHeaderStat();renderContent()}

function fmtHourLabel(h){
  const period=h>=12?'pm':'am';
  let h12=h%12;if(h12===0)h12=12;
  return`${h12}${period}`;
}
function renderTimeOfDayPattern(){
  const tx=(P.transactions||[]).filter(t=>t.timestamp);
  if(tx.length<3)return"";
  const buckets={};
  tx.forEach(t=>{
    const h=new Date(t.timestamp).getHours();
    if(!buckets[h])buckets[h]={hour:h,count:0,total:0};
    buckets[h].count++;buckets[h].total+=Number(t.amount||0);
  });
  const byTotal=Object.values(buckets).sort((a,b)=>b.total-a.total);
  const peak=byTotal[0];
  const peakLabel=`${fmtHourLabel(peak.hour)}–${fmtHourLabel((peak.hour+1)%24)}`;
  const peakLine=`<div style="font-family:var(--font-body);font-size:14px;color:#F6F3EC">Your busiest hour: ${peakLabel}. ${peak.count} sale${peak.count===1?"":"s"}, $${peak.total.toFixed(2)}.</div>`;
  if(tx.length<6)return`<div style="margin-top:16px">${peakLine}</div>`;
  const byHour=Object.values(buckets).sort((a,b)=>a.hour-b.hour);
  const maxTotal=Math.max(...byHour.map(b=>b.total));
  return`
  <div style="margin-top:16px">
    ${peakLine}
    <div style="display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:12px">
      ${byHour.map(b=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
          <div style="width:100%;background:#7A2E42;height:${Math.max(4,Math.round((b.total/maxTotal)*100))}%"></div>
          <div style="font-size:10px;color:rgba(246,243,236,0.6);margin-top:4px">${fmtHourLabel(b.hour)}</div>
        </div>`).join("")}
    </div>
  </div>`;
}

function sendSummaryEmail(){
  const email=(document.getElementById("summary-email")||{}).value||"";
  const msgEl=document.getElementById("summary-msg");
  if(!email||!email.includes("@")){
    if(msgEl){msgEl.style.display="block";msgEl.innerHTML='<div class="warn-box">Please enter a valid email address.</div>'}
    return;
  }
  const stats=getStats(P);
  const s=P.setup||{};const w=P.wrap||{};
  const payload={
    email,
    sale_title:s.saleTitle||"My Garage Sale",
    sale_date:s.saleDate||"",
    money_purpose:s.moneyPurpose||"",
    total_earned:stats.earned.toFixed(2),
    money_goal:stats.goal||"",
    goal_progress:stats.goalProgress,
    total_items:stats.totalItems,
    garage_sale_items:stats.garageSale,
    online_items:stats.online,
    donate_items:stats.donate,
    total_transactions:(P.transactions||[]).length,
    leftovers_donate:w.donate||"",
    leftovers_sell_online:w.sellOnline||"",
    leftovers_keep:w.keep||"",
    leftovers_trash:w.trash||"",
    lessons_learned:w.notes||"",
    memory_box:(P.items||[]).filter(i=>i.decision==='Memory Box').map(i=>({name:i.name,caption:i.notes||""}))
  };
  if(msgEl){msgEl.style.display="block";msgEl.innerHTML='<div class="info-box">Sending your summary...</div>'}
  fetch("/garage-submit.php",{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.success){
      if(msgEl){msgEl.innerHTML='<div class="info-box">Your sale summary is on its way. Check your inbox!</div>'}
      showToast("Summary sent!");
    } else {
      if(msgEl){msgEl.innerHTML='<div class="warn-box">Something went wrong. Please try again.</div>'}
    }
  })
  .catch(()=>{
    if(msgEl){msgEl.innerHTML='<div class="warn-box">Could not send. Check your connection and try again.</div>'}
  });
}

// ─── NOTIFICATIONS ────────────────────────────────────────────────────────────
function addNotif(type,msg,opts){
  const n={id:makeId(),type,message:msg,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),dismissed:false,...(opts||{})};
  P.notifications=[n,...(P.notifications||[])].slice(0,50);
  save();refreshBell();
}
function dismissNotif(id){
  const n=(P.notifications||[]).find(n=>n.id===id);if(n){n.dismissed=true;save();refreshBell();}
}
function dismissAllNotifs(){
  (P.notifications||[]).forEach(n=>n.dismissed=true);save();refreshBell();
}
function activeNotifs(){return(P.notifications||[]).filter(n=>!n.dismissed)}
function refreshBell(){
  const count=activeNotifs().length;
  const badge=document.getElementById('bell-badge');
  if(badge){badge.textContent=count;badge.style.display=count>0?'flex':'none';}
  if(UI.bellOpen)renderBellPanel();
}
function toggleBellPanel(){
  UI.bellOpen=!UI.bellOpen;
  const p=document.getElementById('bell-panel');const ov=document.getElementById('bell-overlay');
  if(!UI.bellOpen){if(p)p.remove();if(ov)ov.remove();return;}
  renderBellPanel();
}
function renderBellPanel(){
  let ov=document.getElementById('bell-overlay');
  if(!ov){
    ov=document.createElement('div');ov.id='bell-overlay';
    ov.style.cssText='position:fixed;inset:0;z-index:999';
    ov.onclick=()=>{UI.bellOpen=false;ov.remove();const p=document.getElementById('bell-panel');if(p)p.remove();};
    document.body.appendChild(ov);
  }
  let p=document.getElementById('bell-panel');
  if(!p){p=document.createElement('div');p.id='bell-panel';document.body.appendChild(p);}
  p.className='bell-panel';
  const notifs=activeNotifs();
  p.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #D9C7AC;background:#262624;flex-shrink:0">
      <span style="font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#FEFCF8">Notifications</span>
      ${notifs.length?`<button onclick="dismissAllNotifs()" style="font-family:'DM Sans',sans-serif;font-size:11px;color:rgba(246,243,236,.75);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline">Clear all</button>`:''}
    </div>
    ${notifs.length===0
      ?`<div class="bell-empty">Nothing new right now.</div>`
      :notifs.map(n=>renderNotifItem(n)).join('')}
  `;
}
function renderNotifItem(n){
  const btns=[];
  if(n.type==='memory'){
    btns.push(`<button class="bell-action-btn" onclick="printMemoryBoxList();dismissNotif('${n.id}')">Print Memory Box list</button>`);
  }
  if(n.type==='wrapUp'){
    btns.push(`<button class="bell-action-btn" onclick="goTab('saleWrap','wrap');dismissNotif('${n.id}');UI.bellOpen=false;document.getElementById('bell-panel')?.remove();document.getElementById('bell-overlay')?.remove()">Go to Leftovers</button>`);
  }
  btns.push(`<button class="bell-dismiss-btn" onclick="dismissNotif('${n.id}')">Dismiss</button>`);
  return`<div class="bell-notif">
    <div class="bell-notif-msg">${esc(n.message)}</div>
    <div class="bell-notif-time">${esc(n.time)}</div>
    <div class="bell-notif-actions">${btns.join('')}</div>
  </div>`;
}
function checkWeatherNotif(){
  if(P.notifFired?.weather)return;
  if(!W.data||!W.data.saleDay)return;
  const sd=W.data.saleDay;const info=wCodeInfo(sd.code);
  if(!info.good||sd.rain>=40){
    const s=P.setup||{};
    const dateLabel=s.saleDate?new Date(s.saleDate+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'your sale day';
    const backupLabel=s.backupDate?new Date(s.backupDate+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'not set';
    if(!P.notifFired)P.notifFired={};P.notifFired.weather=true;
    addNotif('weather',`Rain in the forecast for ${dateLabel}. Your backup date is ${backupLabel}.`);
  }
}
function checkUnpricedNotif(){
  if(P.notifFired?.unpriced)return;
  const unpriced=(P.items||[]).filter(i=>['Garage Sale','Sell Online'].includes(i.decision)&&!i.price);
  if(unpriced.length){
    if(!P.notifFired)P.notifFired={};P.notifFired.unpriced=true;
    addNotif('unpriced',`${unpriced.length} item${unpriced.length===1?" doesn't":" don't"} have a price yet.`);
  }
}
function checkGoalNotifs(){
  const stats=getStats(P);if(!stats.goal)return;
  const pct=stats.goalProgress;
  if(!P.notifFired?.goalHalf&&pct>=50&&pct<100){
    if(!P.notifFired)P.notifFired={};P.notifFired.goalHalf=true;
    addNotif('goalHalf',`Halfway to $${stats.goal}.`);
  }
  if(!P.notifFired?.goalReached&&pct>=100){
    if(!P.notifFired)P.notifFired={};P.notifFired.goalReached=true;
    addNotif('goalReached','You hit your goal. Everything from here is extra.');
  }
}
function checkTimeNotifs(){
  const s=P.setup||{};if(!s.saleDate)return;
  const days=daysUntilSale(s.saleDate);if(days===null||days<0)return;
  const permitTask=prepTasks[1];
  if(!P.notifFired?.permit&&days<=2&&!P.prep?.[permitTask]){
    if(!P.notifFired)P.notifFired={};P.notifFired.permit=true;
    addNotif('permit','Still need to check your permit or HOA rules before sale day.');
  }
  if(!P.notifFired?.safety&&days===1){
    const unchecked=safetyTasks.filter(t=>!P.safety?.tasks?.[t]);
    if(unchecked.length){
      if(!P.notifFired)P.notifFired={};P.notifFired.safety=true;
      addNotif('safety',"Your safety checklist isn't done yet. Worth finishing today.");
    }
  }
  if(!P.notifFired?.saleDay&&days===0){
    if(!P.notifFired)P.notifFired={};P.notifFired.saleDay=true;
    addNotif('saleDay',"Today's the day. Everything is ready.");
  }
  if(days===0&&P.checkInPlan?.times&&P.setup?.emergencyContact){
    if(!P.notifFired?.checkIn){
      if(!P.notifFired)P.notifFired={};P.notifFired.checkIn=true;
      const firstName=(P.setup.emergencyContact).split(/[\s,\u2014\u2013\-]/)[0]||'your contact';
      addNotif('checkIn',`Check in with ${firstName} at your scheduled times today.`);
    }
  }
  if(days===0&&s.saleEndTime){
    const endDate=new Date(s.saleDate+'T'+s.saleEndTime);
    const now=new Date();const diff=endDate-now;
    if(!P.notifFired?.lastHour&&diff<=3600000&&diff>0){
      if(!P.notifFired)P.notifFired={};P.notifFired.lastHour=true;
      addNotif('lastHour','Last hour. Drop everything 50% and move it.');
    }
    if(!P.notifFired?.wrapUp&&diff<=0){
      if(!P.notifFired)P.notifFired={};P.notifFired.wrapUp=true;
      addNotif('wrapUp',"Sale's done. Log what's left before you close out — it takes 2 minutes and you'll want it later.");
    }
  }
}

// ─── FORM HELPERS ─────────────────────────────────────────────────────────────
// sf() = "set field" — safe varargs alternative to setField; path as spread args avoids JSON-in-HTML quoting issues
// nn()/nnMin1() = clamp a typed price/cash/quantity value to a non-negative (or min-1) number before it's stored and rendered as currency
function nn(v){const n=parseFloat(v);return isFinite(n)&&n>0?Math.min(n,100000):0}
// nn() clamps silently by design (it runs on every keystroke) — call this alongside it
// on blur to tell her when what she typed actually got corrected, instead of just
// showing a different number with no explanation (2026-09 critique finding).
function checkPriceFeedback(v,label){
  const raw=parseFloat(v);
  if(v===''||v==null||!isFinite(raw))return;
  if(raw<0)showToast(`${label} can't be negative — set to $0`);
  else if(raw>100000)showToast(`${label} capped at $100,000`);
}
function nnMin1(v){const n=parseInt(v,10);return isFinite(n)&&n>0?n:1}
let _weatherFetchTimer,_lastWeatherSaleDate;
function sf(el,...path){
  const v=el.type==="checkbox"?el.checked:(el.type==="number"?String(nn(el.value)):el.value);
  deepSet(P,path,v);P.isDemo=false;save();
  refreshHeaderStat();refreshMetrics();
  if(path.includes("yourName")){
    refreshHeroTitle();refreshAvatarDisplay();
    const ai=document.getElementById('avatar-name-input');
    if(ai&&document.activeElement!==ai)ai.value=deepGet(P,['setup','yourName'])||'';
  }
  if(UI.tab==="start")refreshGoalProgress();
  if(UI.tab==="start"&&(path.includes("saleDate")||path.includes("backupDate")))refreshCountdown();
  if(path.includes("venmoHandle")||path.includes("cashappHandle")||path.includes("paypalHandle")||path.includes("zelleHandle"))refreshDigitalPaymentsButton();
  if(UI.tab==="start"&&path.includes("saleDate")){
    // oninput and onblur both call sf() — onblur fires again even when the date didn't
    // change (e.g. user just tabs into the zip field). Without this guard that no-op
    // edit still reschedules fetchWeather(), which re-renders the zip prompt from
    // scratch and wipes out whatever zip the user is mid-typing.
    const newDate=P.setup?.saleDate||null;
    if(newDate!==_lastWeatherSaleDate){
      _lastWeatherSaleDate=newDate;
      clearTimeout(_weatherFetchTimer);
      _weatherFetchTimer=setTimeout(()=>fetchWeather(newDate),150);
    }
    const rb=document.getElementById("reminder-btn");
    if(rb){rb.disabled=!P.setup?.saleDate;rb.textContent=P.setup?.saleDate?"Set reminder":"Set reminder (set date first)";}
  }
  if(UI.tab==="saleWrap"&&UI.section==="sale")refreshSubtotal();
  if(UI.tab==="saleWrap"&&UI.section==="wrap"&&path[0]==="wrap")refreshWrapCompletion();
}

let _calPickerPath=null,_calPickerId=null,_calPickerMonth=null;

function closeDatePicker(){

function shiftPickerMonth(delta){
  _calPickerMonth=new Date(_calPickerMonth.getFullYear(),_calPickerMonth.getMonth()+delta,1);
  renderDatePickerPanel();
}
function pickCalendarDate(y,m,d){
  const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const path=_calPickerPath,id=_calPickerId;
  sf({value:dateStr,type:'text'},...path.split("."));
  const labelEl=document.getElementById(`cal-trigger-label-${id}`);
  if(labelEl)labelEl.textContent=new Date(dateStr+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  const trigEl=document.getElementById(`cal-trigger-${id}`);
  if(trigEl)trigEl.style.color='var(--color-text)';
  closeDatePicker();
  // If this date field is the active step in the progressive Sale Setup form, picking a
  // date already answers the step — advance straight to the next field automatically.
  const stepIdx=START_STEPS.findIndex(st=>st.type==='date'&&st.path.join('.')===path);
  if(stepIdx!==-1)startTryAdvance(stepIdx);
}
function renderDatePickerPanel(){
  let ov=document.getElementById('cal-overlay');
  if(!ov){
    ov=document.createElement('div');ov.id='cal-overlay';
    ov.style.cssText='position:fixed;inset:0;z-index:999';
    ov.onclick=closeDatePicker;
    document.body.appendChild(ov);
  }
  let p=document.getElementById('cal-panel');
  if(!p){p=document.createElement('div');p.id='cal-panel';p.className='cal-panel';document.body.appendChild(p);}
  const trig=document.getElementById(`cal-trigger-${_calPickerId}`);
  if(trig){
    const r=trig.getBoundingClientRect();
    p.style.top=`${r.bottom+window.scrollY+6}px`;
    p.style.left=`${Math.min(r.left+window.scrollX,window.innerWidth-272)}px`;
  }
  const y=_calPickerMonth.getFullYear(),m=_calPickerMonth.getMonth();
  const monthLabel=_calPickerMonth.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  const firstDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const current=deepGet(P,_calPickerPath.split("."));
  const selected=current?current:null;
  let cells="";
  for(let i=0;i<firstDow;i++)cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const cellDate=new Date(y,m,d);cellDate.setHours(0,0,0,0);
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=cellDate.getTime()===today.getTime();
    const isSelected=iso===selected;
    cells+=`<button type="button" onclick="pickCalendarDate(${y},${m},${d})" class="cal-day${isSelected?' is-selected':''}${isToday&&!isSelected?' is-today':''}">${d}</button>`;
  }
  p.innerHTML=`
    <div class="cal-panel-header">
      <button type="button" class="cal-nav-btn" onclick="shiftPickerMonth(-1)" aria-label="Previous month">‹</button>
      <span>${monthLabel}</span>
      <button type="button" class="cal-nav-btn" onclick="shiftPickerMonth(1)" aria-label="Next month">›</button>
    </div>
    <div class="cal-panel-dow">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="cal-panel-grid">${cells}</div>
    <button type="button" class="cal-today-link" onclick="const t=new Date();pickCalendarDate(t.getFullYear(),t.getMonth(),t.getDate())">Today</button>
  `;
}

// ─── PIN SALE LOCATION ───────────────────────────────────────────────────────
function pinSaleLocation(){
  const statusEl=document.getElementById('pin-status');
  const setStatus=(msg)=>{if(statusEl){statusEl.style.display='block';statusEl.textContent=msg;}};
  if(!navigator.geolocation){setStatus("Location isn't available on this device — type your address in below.");return;}
  setStatus('Finding your location…');
  navigator.geolocation.getCurrentPosition(async(pos)=>{
    try{
      const{latitude,longitude}=pos.coords;
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&zoom=18&lat=${latitude}&lon=${longitude}`);
      const data=await res.json();
      const a=data&&data.address;
      let addr=null;let gotRoad=false;
      if(a&&a.road){
        gotRoad=true;
        const locality=a.city||a.town||a.municipality||a.village||a.hamlet||a.suburb||a.county||"";
        const stateCode=a["ISO3166-2-lvl4"]?a["ISO3166-2-lvl4"].split("-").pop():(a.state_code||a.state||"");
        addr=`${a.road}, ${locality}, ${stateCode} ${a.postcode||""}`.replace(/\s+,/g,",").replace(/\s+/g," ").trim();
      }else if(data&&data.display_name){
        const parts=data.display_name.split(",").map(p=>p.trim()).filter(p=>p&&!/^(united states|usa|us)$/i.test(p));
        addr=parts.slice(0,5).join(", ");
      }
      if(addr){
        deepSet(P,['setup','address'],addr);save();
        const input=document.getElementById('setup-address-input');
        if(input){
          input.value=addr;
          if(gotRoad){input.focus();input.setSelectionRange(0,0);}
        }
        if(gotRoad){
          setStatus('Street, city, and zip filled in from your location — add your house number at the start.');
        }else{
          setStatus("Couldn't find a street address here — type it in below.");
        }
      }else{

function refreshStickyBar(){

function wCodeInfo(c){
  if(c===0)return{label:'Clear sky',good:true};
  if(c<=2)return{label:'Partly cloudy',good:true};
  if(c<=3)return{label:'Overcast',good:true};
  if(c<=48)return{label:'Foggy',good:false};
  if(c<=67)return{label:'Rain',good:false};
  if(c<=77)return{label:'Snow',good:false};
  if(c<=82)return{label:'Rain showers',good:false};
  return{label:'Thunderstorms',good:false};
}

  if(code<=67)return wrap(`<path d="M19 15.58A4.5 4.5 0 0 0 17.5 7h-1.14A7 7 0 1 0 5 14.5" stroke="${cloud}"/><line x1="8" y1="17" x2="8" y2="22" stroke="${accent}"/><line x1="12" y1="17" x2="12" y2="22" stroke="${accent}"/><line x1="16" y1="17" x2="16" y2="22" stroke="${accent}"/>`);
  if(code<=77)return wrap(`<path d="M19 15.58A4.5 4.5 0 0 0 17.5 7h-1.14A7 7 0 1 0 5 14.5" stroke="${cloud}"/><g stroke="${accent}"><line x1="8" y1="17" x2="8" y2="17.01"/><line x1="8" y1="21" x2="8" y2="21.01"/><line x1="12" y1="19" x2="12" y2="19.01"/><line x1="12" y1="23" x2="12" y2="23.01"/><line x1="16" y1="17" x2="16" y2="17.01"/><line x1="16" y1="21" x2="16" y2="21.01"/></g>`);
  if(code<=82)return wrap(`<path d="M19 13.58A4.5 4.5 0 0 0 17.5 5h-1.14A7 7 0 1 0 5 12.5" stroke="${cloud}"/><line x1="8" y1="15" x2="7" y2="19" stroke="${accent}"/><line x1="12" y1="15" x2="11" y2="19" stroke="${accent}"/><line x1="16" y1="15" x2="15" y2="19" stroke="${accent}"/>`);
  return wrap(`<path d="M19 13.58A4.5 4.5 0 0 0 17.5 5h-1.14A7 7 0 1 0 5 12.5" stroke="${cloud}"/><polyline points="13 12 9 18 13 18 11 23" stroke="${warn}"/>`);

function shiftWeather(delta){
  if(!W.data||!W.data.days)return;
  W.viewStart=Math.max(0,Math.min(W.data.days.length-3,W.viewStart+delta));

async function geocodeZip(zip){
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(zip)}&count=1&language=en&format=json&countryCode=US`);
  const j=await r.json();
  if(!j.results||!j.results.length)throw new Error('zip_not_found');
  return{lat:j.results[0].latitude,lon:j.results[0].longitude};
}

async function fetchWeather(saleDate){
  const el=document.getElementById('weather-card');if(!el)return;
  el.style.display='';
  if(!saleDate){
    el.innerHTML=`<div class="card-title" style="margin-bottom:8px">Sale day weather</div><div style="font-size:14px;color:var(--color-text-muted);line-height:1.6">Set your sale date above and I'll pull the forecast for you.</div>`;
    return;
  }
  const zip=P.setup?.weatherZip;
  if(!zip){
    // don't redraw the prompt out from under someone actively typing their zip into it
    if(document.activeElement&&document.activeElement.id==='weather-zip-input')return;
    renderWeatherZipPrompt();return;
  }
  if(W.forDate===saleDate&&W.forZip===zip&&W.data){renderWeatherCard();return;}
  W.forDate=saleDate;W.forZip=zip;W.loading=true;W.data=null;
  el.innerHTML=`<div class="card-title">Sale day weather</div><div class="text-muted" style="font-size:var(--text-sm);margin-top:6px">Checking forecast…</div>`;
  try{
    let latLon=W.latLon;
    if(!latLon||W.latLonZip!==zip){latLon=await geocodeZip(zip);W.latLon=latLon;W.latLonZip=zip;}
    const{lat,lon}=latLon;
    const todayObj=new Date();todayObj.setHours(0,0,0,0);
    const dateObj=new Date(saleDate+'T00:00:00');
    const daysAway=Math.round((dateObj-todayObj)/86400000);
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&forecast_days=16&timezone=auto`;
    const r=await fetch(url);const j=await r.json();
    const cw=j.current_weather||{};
    const current={temp:Math.round(cw.temperature||0),code:cw.weathercode||0};
    W.loading=false;
    if(daysAway<0){W.data={current,msg:'Sale date has passed.'};renderWeatherCard();return;}
    if(daysAway>15){
      const waitDays=daysAway-15;
      W.data={current,msg:`Right now, it's ${current.temp}° and ${wCodeInfo(current.code).label.toLowerCase()} nearby. Your sale-day forecast unlocks in ${waitDays} day${waitDays===1?'':'s'}, once it's within 16 days out.`};
      renderWeatherCard();return;
    }
    const times=j.daily.time||[];
    const todayStr=todayObj.toISOString().split('T')[0];
    const salei=times.indexOf(saleDate)>=0?times.indexOf(saleDate):Math.min(daysAway,times.length-1);
    const days=times.map((date,idx)=>{
      const d=new Date(date+'T00:00:00');
      return{date,day:d.toLocaleDateString('en-US',{weekday:'short'}),dateNum:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),
        code:j.daily.weathercode[idx],high:Math.round(j.daily.temperature_2m_max[idx]),low:Math.round(j.daily.temperature_2m_min[idx]),
        rain:j.daily.precipitation_probability_max[idx],isToday:date===todayStr,isSaleDay:idx===salei};
    });
    W.viewStart=Math.max(0,salei-1);
    W.data={current,days,saleDay:days[salei]};
  }catch(e){
    W.loading=false;
    W.data={msg:e.message==='zip_not_found'?'Zip code not found — try a nearby zip.':'Could not load forecast. Check your connection.',zipError:true};
  }
  renderWeatherCard();
}
function renderWeatherCard(){
  const el=document.getElementById('weather-card');if(!el)return;
  if(!W.data){el.innerHTML=`<div class="card-title">Sale day weather</div><div class="text-muted" style="font-size:var(--text-sm);margin-top:6px">Checking forecast…</div>`;return;}
  if(W.data.msg){
    const c=W.data.current;
    const header=c?`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">Sale day weather</div>
      <div style="display:flex;align-items:center;gap:6px" title="${wCodeInfo(c.code).label}">
        ${weatherIconSvg(c.code,24)}
        <span style="font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--color-text)">${c.temp}°</span>
        <span style="font-size:11px;color:var(--color-text-muted)">now</span>
      </div>
    </div>`:`<div class="card-title">Sale day weather</div>`;
    el.innerHTML=`${header}<div class="text-muted" style="font-size:var(--text-sm);margin-top:6px">${W.data.msg}</div>${W.data.zipError?'<button onclick="clearWeatherZip()" style="margin-top:8px;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--color-primary-text);background:none;border:none;cursor:pointer;padding:0">Try a different zip →</button>':''}`;
    return;
  }
  const cur=W.data.current;
  const curInfo=wCodeInfo(cur.code);
  const sd=W.data.saleDay;
  const sdInfo=wCodeInfo(sd.code);
  const good=sdInfo.good&&sd.rain<40;
  const dotColor=good?'#46703F':'#9E3D0F';
  const indicatorBg=good?'#EFE8DC':'#D9C7AC';
  const indicatorText=good?'Good sale weather'
    :sd.rain>=40?`Heads up — rain ${sd.day}`
    :`Heads up — ${sdInfo.label.toLowerCase()} ${sd.day}`;
  const days=W.data.days;
  const vs=W.viewStart;
  const visible=days.slice(vs,vs+3);
  const canLeft=vs>0;
  const canRight=vs+3<days.length;
  const arrowBtn=(dir,enabled)=>`<button onclick="shiftWeather(${dir})" style="background:none;border:1.5px solid ${enabled?'#7A2E42':'#D9C7AC'};width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:${enabled?'pointer':'default'};color:${enabled?'#7A2E42':'#D9C7AC'};font-size:14px;flex-shrink:0" ${enabled?'':'disabled'}>${dir<0?'‹':'›'}</button>`;
  const stripHTML=visible.map(d=>{
    const info=wCodeInfo(d.code);
    const highlight=d.isSaleDay?'background:#EFE8DC;':'';
    const labelColor=d.isSaleDay?'var(--color-primary)':d.isToday?'var(--color-text)':'var(--color-text-muted)';
    const topLabel=d.isToday&&!d.isSaleDay?'Today':d.isSaleDay?`${d.day} — SALE`:d.day;
    return`<div style="flex:1;text-align:center;padding:10px 4px;${highlight}">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:${labelColor};margin-bottom:2px">${topLabel}</div>
      <div style="font-size:10px;color:${d.isSaleDay?'var(--color-primary)':'var(--color-text-muted)'};margin-bottom:6px">${d.dateNum}</div>
      <div style="display:flex;justify-content:center;margin-bottom:6px" title="${info.label}">${weatherIconSvg(d.code,26)}</div>
      <div style="font-size:13px;font-weight:700;color:var(--color-text)">${d.high}°</div>
      <div style="font-size:11px;color:var(--color-text-muted)">${d.low}°</div>
      <div style="font-size:10px;color:${d.rain>=40?'#9E3D0F':'var(--color-text-muted)'};margin-top:3px">${d.rain}% rain</div>
    </div>`;
  }).join('');
  el.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">Sale day weather</div>
      <div style="display:flex;align-items:center;gap:6px" title="${curInfo.label}">
        ${weatherIconSvg(cur.code,24)}
        <span style="font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--color-text)">${cur.temp}°</span>
        <span style="font-size:11px;color:var(--color-text-muted)">now</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
      ${arrowBtn(-1,canLeft)}
      <div style="display:flex;flex:1;gap:4px">${stripHTML}</div>
      ${arrowBtn(1,canRight)}
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:9px 13px;background:${indicatorBg}">
      <div style="width:9px;height:9px;background:${dotColor};flex-shrink:0"></div>
      <span style="font-size:13px;font-weight:600;color:var(--color-text)">${indicatorText}</span>
    </div>
    ${!good?`<div style="margin-top:10px;font-size:13px;color:var(--color-text-muted);line-height:1.6">Rain's looking likely. Worth having a backup date in your pocket.</div>`:""}
    <div style="margin-top:10px;text-align:right"><button onclick="clearWeatherZip()" style="font-family:var(--font-body);font-size:11px;color:var(--color-text-muted);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline">Change zip</button></div>
    `;
  checkWeatherNotif();
}

}
function closeTour(){
  const ov=document.getElementById('tour-overlay');
  if(ov){ov.style.opacity='0';setTimeout(()=>{ov.style.display='none';ov.innerHTML='';},180);}
  unlockBodyScroll();
  const scrim=document.getElementById('tour-scrim');
  if(scrim)scrim.style.display='none';
  _clearTourSpotlight();
}
function finishTour(){

}
function skipTour(){finishTour();}
function jumpIn(){finishTour();}
function startSpotlightTour(){_tourStep=0;renderTourStep();}
function nextTourStep(){
  _tourStep=Math.min(_tourStep+1,tourSpotlightSteps.length);
  renderTourStep();
}
function _clearTourSpotlight(){
  const nav=document.getElementById('main-nav');
  if(nav)Array.from(nav.children).forEach(b=>b.classList.remove('tour-spotlight-tab'));
}
function renderTourStep(){
  const ov=document.getElementById('tour-overlay');
  const scrim=document.getElementById('tour-scrim');
  if(!ov)return;
  _clearTourSpotlight();

  if(_tourStep===-1){
    if(scrim)scrim.style.display='none';
    ov.style.pointerEvents='auto';
    ov.innerHTML=`
    <div style="position:absolute;inset:0;background:rgba(37,37,53,0.75);display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="background:#F6F3EC;border-radius:var(--radius-xl);max-width:480px;width:100%;padding:36px 32px;text-align:center">
        <p style="font-family:var(--font-body);font-size:16px;color:#262624;line-height:1.6;margin-bottom:26px">I built this so nothing gets missed. Let me show you where everything lives.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button onclick="startSpotlightTour()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:#262624;color:#F6F3EC;border:none;padding:13px 26px;cursor:pointer">Show me around</button>
          <button onclick="jumpIn()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:transparent;color:#262624;border:1.5px solid #262624;padding:13px 26px;cursor:pointer">Jump in</button>
        </div>
      </div>
    </div>`;
    return;
  }

  if(_tourStep<tourSpotlightSteps.length){
    const step=tourSpotlightSteps[_tourStep];
    if(scrim)scrim.style.display='block';
    ov.style.pointerEvents='none';
    const nav=document.getElementById('main-nav');
    const tabBtn=nav?nav.children[step.tabIdx]:null;
    if(tabBtn)tabBtn.classList.add('tour-spotlight-tab');
    const isLast=_tourStep===tourSpotlightSteps.length-1;

    const cardW=320;
    const vw=window.innerWidth;
    let top=120,left=16;
    if(tabBtn){
      const r=tabBtn.getBoundingClientRect();
      top=r.bottom+10;
      left=r.left;
    }
    if(left+cardW+16>vw)left=Math.max(16,vw-cardW-16);
    if(left<16)left=16;

    ov.innerHTML=`
    <div style="position:absolute;top:${top}px;left:${left}px;width:${cardW}px;max-width:calc(100vw - 32px);background:#F6F3EC;border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:18px 20px;pointer-events:auto">
      <div style="font-family:var(--font-body);font-size:12px;color:#6B655C;margin-bottom:8px">Step ${_tourStep+1} of 5</div>
      <div style="font-family:var(--font-body);font-size:14px;color:#262624;line-height:1.55;margin-bottom:16px">${esc(step.body)}</div>
      <div style="display:flex;align-items:center;gap:16px">
        <button onclick="nextTourStep()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:#262624;color:#F6F3EC;border:none;padding:9px 20px;cursor:pointer">${isLast?'Got it':'Next'}</button>
        <button onclick="skipTour()" style="font-family:var(--font-body);font-size:13px;color:#6B655C;background:none;border:none;cursor:pointer;padding:0">Skip tour</button>
      </div>
    </div>`;
    return;
  }

  // Closing card
  if(scrim)scrim.style.display='none';
  ov.style.pointerEvents='auto';
  ov.innerHTML=`
  <div style="position:absolute;inset:0;background:rgba(37,37,53,0.75);display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="background:#F6F3EC;max-width:480px;width:100%;padding:36px 32px;text-align:center">
      <p style="font-family:var(--font-body);font-size:16px;color:#262624;line-height:1.6;margin-bottom:26px">That's it. Everything saves automatically as you go.</p>
      <button onclick="finishTour()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:#262624;color:#F6F3EC;border:none;padding:13px 26px;cursor:pointer">Got it</button>
    </div>
  </div>`;
}

  {id:'digital-payments',title:'How to Accept Digital Payments',available:true,body:`

      <p style="margin-bottom:18px">When a buyer pays you, always ask them to send as "Goods &amp; Services" — not "Friends &amp; Family." Friends &amp; Family payments have no buyer or seller protection. If a buyer sends the wrong way, you can ask them to cancel and resend.</p>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--color-text);margin-bottom:6px">Zelle</h4>

        <span>Quick notes</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="scratch-clear" onclick="openHelp('quick-notes-move')" aria-label="Help — moving this panel" title="Help">?</button>
        <button class="scratch-close" onclick="closeScratchPad()" aria-label="Close quick notes">×</button>
      </div>
    </div>
    <div class="scratch-list">${listHTML}</div>
    <button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px" onclick="newScratchNote()">+ New note</button>`;
}
function newScratchNote(){
  const note={id:makeId(),text:'',updatedAt:Date.now()};
  P.scratchNotes=[note,...(P.scratchNotes||[])];
  save();
  UI.scratchNoteId=note.id;
  renderScratchPanel();
}
function openScratchNote(id){
  flushScratchNote();
  UI.scratchNoteId=id;
  renderScratchPanel();
}
function backToScratchList(){
  flushScratchNote();
  UI.scratchNoteId=null;
  renderScratchPanel();
}
function onScratchNoteInput(v){
  setScratchStatus('Typing…');
  clearTimeout(_scratchTimer);
  _scratchTimer=setTimeout(()=>{
    const note=(P.scratchNotes||[]).find(n=>n.id===UI.scratchNoteId);
    if(note){note.text=v;note.updatedAt=Date.now();save();setScratchStatus('Saved to this browser');}
  },500);
}
function flushScratchNote(){
  clearTimeout(_scratchTimer);
  if(!UI.scratchNoteId)return;
  const ta=document.getElementById('scratch-textarea');
  const note=(P.scratchNotes||[]).find(n=>n.id===UI.scratchNoteId);
  if(ta&&note&&note.text!==ta.value){note.text=ta.value;note.updatedAt=Date.now();save();}
}
function setScratchStatus(msg){
  const el=document.getElementById('scratch-status');
  if(el)el.textContent=msg;
}
function deleteScratchNote(id){
  mncConfirm("Delete this note?",()=>{
    P.scratchNotes=(P.scratchNotes||[]).filter(n=>n.id!==id);
    save();
    if(UI.scratchNoteId===id)UI.scratchNoteId=null;
    renderScratchPanel();
  });
}
window.addEventListener('beforeunload',flushScratchNote);

// ─── QUICK NOTES DRAG ─────────────────────────────────────────────────────────
(function initScratchDrag(){
  const POS_KEY='mnc-scratch-pos';
  let dragging=false,startX=0,startY=0,startLeft=0,startBottom=0,panelEl=null;

  function clamp(val,min,max){return Math.min(Math.max(val,min),max);}

  function applyPos(panel,left,bottom){
    const w=panel.offsetWidth||300,h=panel.offsetHeight||200;
    const maxLeft=window.innerWidth-w-8;
    const maxBottom=window.innerHeight-h-8;
    left=clamp(left,8,Math.max(8,maxLeft));
    bottom=clamp(bottom,8,Math.max(8,maxBottom));
    panel.style.left=left+'px';
    panel.style.right='auto';
    panel.style.bottom=bottom+'px';
    return{left,bottom};
  }

  function savePos(left,bottom){
    try{localStorage.setItem(POS_KEY,JSON.stringify({left,bottom}));}catch(e){}
  }
  function restorePos(panel){
    try{
      const raw=localStorage.getItem(POS_KEY);
      if(!raw)return;
      const pos=JSON.parse(raw);
      if(pos&&typeof pos.left==='number'&&typeof pos.bottom==='number'){
        applyPos(panel,pos.left,pos.bottom);
      }
    }catch(e){}
  }

  function pointerXY(e){
    if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
    if(e.changedTouches&&e.changedTouches.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
    return{x:e.clientX,y:e.clientY};
  }

  function onDragStart(e){
    const handle=e.target.closest&&e.target.closest('#scratch-drag-handle');
    if(!handle)return;
    panelEl=document.getElementById('scratch-panel');
    if(!panelEl)return;
    const rect=panelEl.getBoundingClientRect();
    const xy=pointerXY(e);
    dragging=true;
    startX=xy.x;startY=xy.y;
    startLeft=rect.left;
    startBottom=window.innerHeight-rect.bottom;
    panelEl.classList.add('is-dragging');
    e.preventDefault();
  }
  function onDragMove(e){
    if(!dragging||!panelEl)return;
    const xy=pointerXY(e);
    const dx=xy.x-startX;
    const dy=xy.y-startY;
    applyPos(panelEl,startLeft+dx,startBottom-dy);
    e.preventDefault();
  }
  function onDragEnd(){
    if(!dragging||!panelEl)return;
    dragging=false;
    panelEl.classList.remove('is-dragging');
    const rect=panelEl.getBoundingClientRect();
    const left=rect.left;
    const bottom=window.innerHeight-rect.bottom;
    savePos(left,bottom);
    panelEl=null;
  }

  document.addEventListener('mousedown',onDragStart);
  document.addEventListener('mousemove',onDragMove);
  document.addEventListener('mouseup',onDragEnd);
  document.addEventListener('touchstart',onDragStart,{passive:false});
  document.addEventListener('touchmove',onDragMove,{passive:false});
  document.addEventListener('touchend',onDragEnd);

  const _origOpenScratchPad=window.openScratchPad;
  window.openScratchPad=function(){
    _origOpenScratchPad();
    const panel=document.getElementById('scratch-panel');
    if(panel)restorePos(panel);
  };
})();

// ─── QUICK NOTES BUTTON DRAG (move the circle itself, no need to open it) ─────
(function initScratchButtonDrag(){
  const BTN_POS_KEY='mnc-scratch-btn-pos';
  const DRAG_THRESHOLD=6;
  let pressing=false,moved=false,justDragged=false;
  let startX=0,startY=0,startLeft=0,startBottom=0,btnEl=null;

  function clamp(val,min,max){return Math.min(Math.max(val,min),max);}

  function applyBtnPos(btn,left,bottom){
    const w=btn.offsetWidth||44,h=btn.offsetHeight||44;
    const maxLeft=window.innerWidth-w-8;
    const maxBottom=window.innerHeight-h-8;
    left=clamp(left,8,Math.max(8,maxLeft));
    bottom=clamp(bottom,8,Math.max(8,maxBottom));
    btn.style.left=left+'px';
    btn.style.right='auto';
    btn.style.bottom=bottom+'px';
    return{left,bottom};
  }
  function saveBtnPos(left,bottom){
    try{localStorage.setItem(BTN_POS_KEY,JSON.stringify({left,bottom}));}catch(e){}
  }
  function restoreBtnPos(btn){
    try{
      const raw=localStorage.getItem(BTN_POS_KEY);
      if(!raw)return;
      const pos=JSON.parse(raw);
      if(pos&&typeof pos.left==='number'&&typeof pos.bottom==='number'){
        applyBtnPos(btn,pos.left,pos.bottom);
      }
    }catch(e){}
  }
  function pointerXY(e){
    if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
    if(e.changedTouches&&e.changedTouches.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
    return{x:e.clientX,y:e.clientY};
  }

  function onPressStart(e){
    const btn=e.target.closest&&e.target.closest('#scratch-toggle');
    if(!btn)return;
    btnEl=btn;
    const rect=btn.getBoundingClientRect();
    const xy=pointerXY(e);
    pressing=true;moved=false;
    startX=xy.x;startY=xy.y;
    startLeft=rect.left;
    startBottom=window.innerHeight-rect.bottom;
  }
  function onPressMove(e){
    if(!pressing||!btnEl)return;
    const xy=pointerXY(e);
    const dx=xy.x-startX,dy=xy.y-startY;
    if(!moved&&Math.hypot(dx,dy)>DRAG_THRESHOLD){
      moved=true;
      btnEl.classList.add('is-dragging');
    }
    if(moved){
      applyBtnPos(btnEl,startLeft+dx,startBottom-dy);
      e.preventDefault();
    }
  }
  function onPressEnd(){
    if(!pressing||!btnEl)return;
    pressing=false;
    if(moved){
      btnEl.classList.remove('is-dragging');
      const rect=btnEl.getBoundingClientRect();
      saveBtnPos(rect.left,window.innerHeight-rect.bottom);
      justDragged=true;
    }
    moved=false;
    btnEl=null;
  }

  document.addEventListener('mousedown',onPressStart);
  document.addEventListener('mousemove',onPressMove);
  document.addEventListener('mouseup',onPressEnd);
  document.addEventListener('touchstart',onPressStart,{passive:true});
  document.addEventListener('touchmove',onPressMove,{passive:false});
  document.addEventListener('touchend',onPressEnd);

  function wireToggleBtn(){
    const toggleBtn=document.getElementById('scratch-toggle');
    if(!toggleBtn)return;
    restoreBtnPos(toggleBtn);
    toggleBtn.addEventListener('click',function(e){
      if(justDragged){justDragged=false;e.preventDefault();e.stopPropagation();return;}
      toggleScratchPad();
    });
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',wireToggleBtn);
  }else{
    wireToggleBtn();
  }
})();
