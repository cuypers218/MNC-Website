      <div style="font-family:var(--font-body);font-size:14px;color:#252535;line-height:1.55;margin-bottom:16px">${esc(step.body)}</div>
      <div style="display:flex;align-items:center;gap:16px">
        <button onclick="nextTourStep()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:#252535;color:#FFF8EE;border:none;padding:9px 20px;cursor:pointer">${isLast?'Got it':'Next'}</button>
        <button onclick="skipTour()" style="font-family:var(--font-body);font-size:13px;color:#4B4B4B;background:none;border:none;cursor:pointer;padding:0">Skip tour</button>
      </div>
    </div>`;
    return;
  }

  // Closing card
  if(scrim)scrim.style.display='none';
  ov.style.pointerEvents='auto';
  ov.innerHTML=`
  <div style="position:absolute;inset:0;background:rgba(37,37,53,0.75);display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="background:#FFF8EE;max-width:480px;width:100%;padding:36px 32px;text-align:center">
      <p style="font-family:var(--font-body);font-size:16px;color:#252535;line-height:1.6;margin-bottom:26px">That's it. Everything saves automatically as you go.</p>
      <button onclick="finishTour()" style="font-family:var(--font-body);font-weight:600;font-size:14px;background:#252535;color:#FFF8EE;border:none;padding:13px 26px;cursor:pointer">Got it</button>
    </div>
  </div>`;
}

// ─── HELP ─────────────────────────────────────────────────────────────────────
const helpTopics=[

      <button class="btn btn-secondary" onclick="retakeTourFromHelp()" style="margin-bottom:26px">Take the tour again</button>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">Saving</h4>
      <p style="margin-bottom:24px">Everything saves automatically as you type. You don't need to hit save — but there's a Save button in the top nav if you want to force it. You can close the tab and come back. Your work will be there.</p>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">The 5 sections</h4>
      <p style="margin-bottom:18px"><strong style="color:var(--color-text)">Start</strong> — Set your sale up: date, money goal, address. Fill this in first. The rest of the tool pulls from it.</p>
      <p style="margin-bottom:18px"><strong style="color:var(--color-text)">Sort + Price</strong> — Your inventory. Add items as you sort through your stuff. Mark what you're selling, donating, keeping, or passing to your kids. Price everything here before sale day.</p>
      <p style="margin-bottom:18px"><strong style="color:var(--color-text)">Sell + Promote</strong> — Online listings and advertising. Get your Facebook Marketplace and Nextdoor posts ready, build your signs, plan your advertising before the day hits.</p>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">Reset Everything</h4>
      <p style="margin-bottom:24px">In the footer. Clears all your data back to zero — every field, every item, every sale log. There's a confirmation step before it runs. This cannot be undone.</p>

      <p>Questions or feedback? <a href="mailto:cece@mynestchapter.com?subject=Garage%20Sale%20Planner" style="color:var(--color-primary);text-decoration:none">Email Cece →</a></p>
    </div>`},
  {id:'digital-payments',title:'How to Accept Digital Payments',available:true,body:`
    <div style="font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--color-text)">
      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">PayPal</h4>
      <p style="margin-bottom:18px">To accept PayPal at your sale, you need a PayPal account. If you don't have one, create a free personal account at paypal.com.</p>
      <p style="margin-bottom:18px">When a buyer pays you, always ask them to send as "Goods &amp; Services" — not "Friends &amp; Family." Friends &amp; Family payments have no buyer or seller protection. If a buyer sends the wrong way, you can ask them to cancel and resend.</p>
      <p style="margin-bottom:24px">Your PayPal handle is your email address or phone number on file with your account. Share whichever you use to log in.</p>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">Venmo</h4>
      <p style="margin-bottom:18px">Venmo is free to set up at venmo.com or through the Venmo app. Your handle is your @username — buyers search for it or scan your QR code (found in the Venmo app under your profile).</p>
      <p style="margin-bottom:24px">Payments from buyers go to your Venmo balance. Transfer to your bank account at any time — standard transfers are free and take 1–3 business days. Instant transfers have a small fee.</p>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">Cash App</h4>
      <p style="margin-bottom:18px">Cash App is free at cash.app or through the Cash App app. Your handle is your $Cashtag — a unique name you choose when you set up your account.</p>
      <p style="margin-bottom:24px">Buyers search your $Cashtag or scan your QR code (found in the Cash App under your profile). Payments go to your Cash App balance and can be transferred to your bank account.</p>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">Zelle</h4>
      <p style="margin-bottom:18px">Zelle is built into most major bank apps — check your bank's app to see if it's available. If your bank supports Zelle, you're already enrolled; no separate account needed.</p>
      <p style="margin-bottom:24px">Buyers send to your email address or phone number. Zelle transfers go directly to your bank account, usually within minutes. Zelle does not have a QR code — buyers need your email or phone number.</p>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">A note on chargebacks</h4>
      <p>Cash has no chargeback risk. Digital payments are generally safe for small transactions but it's worth knowing: PayPal Goods &amp; Services allows buyers to file a dispute. For garage sale items, this is rare — but if someone pays and later disputes the charge, PayPal may hold the funds while they investigate. For high-value items, cash is always the safest option.</p>
    </div>`},

    <div style="font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--color-text)">
      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">Online</h4>
      <p style="margin-bottom:18px">Post Thursday night. People plan their Saturday route on Friday — if you're not in their feed by then, you don't make the list.</p>
      <p style="margin-bottom:18px">Hold the full address until 24 hours before. Share it by DM when someone asks — the morning before at the earliest.</p>
      <p style="margin-bottom:18px">Take three photos before you post: a wide shot of your whole setup, a close-up of anything with obvious value. They don't have to be perfect.</p>
      <p style="margin-bottom:24px">Nextdoor won't let you post a garage sale listing too far in advance. Wait until Friday or the post may not stay visible through Saturday.</p>

      <h4 style="font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--color-text);margin-bottom:6px">Signs</h4>
      <p style="margin-bottom:18px">Put signs up Friday evening if weather allows — morning of the sale if there's rain overnight.</p>
      <p style="margin-bottom:18px">Put a sign at every turn someone has to make to reach your house. Arrows matter more than your address. Someone driving at 25mph can't read a street number.</p>
      <p>Take them down the same day. It's a courtesy. In some neighborhoods it's required.</p>
    </div>`},

    <div style="font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--color-text)">
      <p style="margin-bottom:18px">Decide before the sale, not after. Know where unsold stuff is going before you open your doors — otherwise you're making tired decisions at 2pm when the adrenaline wears off.</p>
      <p style="margin-bottom:18px">Have a donation box or empty car trunk ready to load the moment you close. The goal is that nothing unsold re-enters the house.</p>
      <p style="margin-bottom:18px">Options in order: load the car and donate same day. Free pile on the curb for the last hour with a sign. Facebook Marketplace for anything valuable that didn't move — do it before it goes back in a closet. Trash what isn't worth donating.</p>

let _helpTopic=null;
function openHelp(topicId){
  _helpTopic=topicId||null;
  const ov=document.getElementById('help-overlay');
  if(!ov)return;
  ov.style.display='block';
  ov.style.opacity='0';
  renderHelpOverlay();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ov.style.opacity='1';}));
}
function closeHelp(){
  const ov=document.getElementById('help-overlay');
  if(ov){ov.style.opacity='0';setTimeout(()=>{ov.style.display='none';},180);}
}
function openHelpTopic(id){
  const topic=helpTopics.find(t=>t.id===id);
  if(!topic||!topic.available)return;
  _helpTopic=id;
  renderHelpOverlay();
}
function backToHelpList(){
  _helpTopic=null;
  renderHelpOverlay();
}
function renderHelpTopicList(){
  return`<div style="display:flex;flex-direction:column">
    ${helpTopics.map(t=>t.available
      ?`<button onclick="openHelpTopic('${t.id}')" style="text-align:left;background:none;border:none;border-bottom:1px solid var(--color-divider);padding:16px 0;font-family:var(--font-body);font-size:15px;color:var(--color-text);cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%">${esc(t.title)}<span style="color:var(--color-primary)">→</span></button>`
      :`<div style="padding:16px 0;border-bottom:1px solid var(--color-divider);font-family:var(--font-body);font-size:15px;color:var(--color-text-muted);display:flex;justify-content:space-between;align-items:center">${esc(t.title)}<span style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">Coming soon</span></div>`
    ).join('')}
  </div>`;
}
function renderHelpOverlay(){
  const ov=document.getElementById('help-overlay');if(!ov)return;
  const topic=_helpTopic?helpTopics.find(t=>t.id===_helpTopic):null;
  ov.innerHTML=`
  <div style="position:absolute;inset:0;background:rgba(37,37,53,0.55);display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="background:var(--color-surface);border-radius:var(--radius-xl);max-width:640px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--color-divider);flex-shrink:0">
        ${topic?`<button onclick="backToHelpList()" style="background:none;border:none;font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--color-primary);cursor:pointer;padding:0">← Back</button>`:''}
        <div style="flex:1;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--color-text)">${topic?esc(topic.title):'Help'}</div>
        <button onclick="closeHelp()" aria-label="Close help" style="background:none;border:none;font-size:22px;line-height:1;color:var(--color-text-muted);cursor:pointer;padding:0">×</button>
      </div>
      <div style="padding:24px;overflow-y:auto">
        ${topic?topic.body:renderHelpTopicList()}
      </div>
    </div>
  </div>`;
}

// ─── QUICK-CAPTURE SCRATCH PAD ────────────────────────────────────────────────
let _scratchTimer;
function toggleScratchPad(){
  if(UI.scratchOpen)closeScratchPad();else openScratchPad();
}
function openScratchPad(){
  UI.scratchOpen=true;
  const panel=document.getElementById('scratch-panel');
  const btn=document.getElementById('scratch-toggle');
  if(!panel||!btn)return;
  panel.style.display='block';
  btn.setAttribute('aria-expanded','true');
  const ta=document.getElementById('scratch-textarea');
  if(ta)ta.value=P.scratchPad||'';
  setScratchStatus(P.scratchPad?'Saved to this browser':'Not saved yet');
}
function closeScratchPad(){
  flushScratchPad();
  UI.scratchOpen=false;
  const panel=document.getElementById('scratch-panel');
  const btn=document.getElementById('scratch-toggle');
  if(panel)panel.style.display='none';
  if(btn)btn.setAttribute('aria-expanded','false');
}
function onScratchInput(v){
  setScratchStatus('Typing…');
  clearTimeout(_scratchTimer);
  _scratchTimer=setTimeout(()=>{P.scratchPad=v;save();setScratchStatus('Saved to this browser');},500);
}
function flushScratchPad(){
  clearTimeout(_scratchTimer);
  const ta=document.getElementById('scratch-textarea');
  if(ta&&P.scratchPad!==ta.value){P.scratchPad=ta.value;save();}
}
function saveScratchPad(){
  flushScratchPad();
  showToast('Notes saved');
  closeScratchPad();
}
function setScratchStatus(msg){
  const el=document.getElementById('scratch-status');
  if(el)el.textContent=msg;
}
function clearScratchPad(){
  clearTimeout(_scratchTimer);
  P.scratchPad='';save();
  const ta=document.getElementById('scratch-textarea');
  if(ta)ta.value='';
  setScratchStatus('Not saved yet');
}
window.addEventListener('beforeunload',flushScratchPad);

render();
refreshStickyBar();
refreshBell();
checkTimeNotifs();
checkGoalNotifs();
checkUnpricedNotif();
if(localStorage.getItem(TOUR_KEY)!=='true'){setTimeout(()=>openTour(),700);}
setInterval(checkTimeNotifs,60000);
let _resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(_resizeTimer);
  _resizeTimer=setTimeout(()=>{
    if(UI.tab==='sortPrice'&&(UI.section==='inventory'||UI.section==='batch'))renderContent();
  },150);
},{passive:true});
</script>
