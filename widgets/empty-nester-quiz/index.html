<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Kind of Empty Nester Are You? | My Nest Chapter</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    font-size: 12pt;
    color: #1E2F33;
    background-color: #EAF7FA;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px;
  }

  .skip-link {
    position: absolute; top: -40px; left: 0;
    background: #1E2F33; color: #EAF7FA;
    padding: 8px 16px;
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 9pt;
    text-decoration: none; z-index: 100;
  }
  .skip-link:focus { top: 0; }

  #content:focus { outline: none; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .brand-tag {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 9pt; letter-spacing: 3.5px; color: #46585C;
    text-transform: uppercase; text-align: center; margin-bottom: 6px;
    justify-content: center;
  }
  .brand-tag span { display: block; width: 24px; height: 1px; background: currentColor; opacity: 0.5; }

  .brand-sub {
    font-family: 'Montserrat', sans-serif; font-weight: 400;
    font-size: 8pt; letter-spacing: 1px; color: #46585C;
    text-transform: uppercase; text-align: center; margin-bottom: 32px;
  }

  .widget-container {
    width: 100%; max-width: 550px;
    background: #FFFFFF;
    border: 1px solid #D9ECEF;
    border-radius: 10px;
    padding: 24px;
    overflow: visible;
    position: relative;
    box-shadow: 0 10px 40px rgba(31,111,120,0.07);
  }
  .widget-container::before { display: none; }

  @keyframes contentFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .content-enter { animation: contentFadeIn 0.22s ease both; }

  .progress-wrap { margin-bottom: 14px; }
  .progress-label {
    font-family: 'Montserrat', sans-serif; font-weight: 400;
    font-size: 8pt; color: #46585C; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .progress-bar-bg { background: #D9ECEF; height: 4px; width: 100%; overflow: hidden; }
  .progress-bar-fill { background: #1F6F78; height: 4px; width: 100%; transform-origin: left; transform: scaleX(0); transition: transform 0.3s ease; }

  .scene {
    display: block !important;
    position: relative !important;
    width: 100% !important;
    margin: 0 0 14px 0 !important;
    overflow: visible !important;
    border-radius: 0 !important;
    background: transparent !important;
    text-align: center !important;
  }

  .scene img {
    display: block !important;
    width: 100% !important;
    max-height: 200px !important;
    height: auto !important;
    object-fit: contain !important;
    object-position: center !important;
  }

  .scene.scene-result {
    display: block !important;
    position: relative !important;
    width: 100% !important;
    aspect-ratio: auto !important;
    margin: 0 0 28px 0 !important;
    background: #EAF7FA !important;
    border: 1px solid #D9ECEF !important;
    padding: 20px 16px !important;
    overflow: hidden !important;
    border-radius: 0 !important;
    text-align: center !important;
  }
  .scene.scene-result img {
    display: block;
    margin: 0 auto;
    max-height: 180px;
    width: auto;
    height: auto;
    object-fit: initial;
  }
  .scene svg { max-width: 260px; width: 100%; }

  h2.question {
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 14pt; color: #1E2F33; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 12px; line-height: 1.3;
  }

  .answers { display: flex; flex-direction: column; gap: 0; }

  .answer-btn {
    font-family: 'Montserrat', sans-serif; font-size: 11pt; color: #1E2F33;
    background: #FFFFFF; border: 1px solid #D9ECEF; border-bottom: none;
    padding: 11px 16px; text-align: left; cursor: pointer;
    line-height: 1.5; transition: background 0.15s; touch-action: manipulation;
  }
  .answer-btn:last-child { border-bottom: 1px solid #D9ECEF; }
  .answer-btn:hover { background: #EAF7FA; border-color: #1F6F78; }
  .answer-btn.selected { background: #EAF7FA; border-color: #1F6F78; color: #1E2F33; font-weight: bold; }
  .answer-btn:active { transform: translateY(1px); }

  .answer-letter {
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 9pt; color: #1F6F78; margin-right: 12px; text-transform: uppercase;
  }

  .btn-primary {
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 12pt; color: #FFFFFF; background: #1F6F78; border: none;
    border-radius: 6px;
    padding: 12px 32px; cursor: pointer; text-transform: uppercase;
    letter-spacing: 1px; width: 100%; margin-top: 14px;
    touch-action: manipulation; display: block;
  }
  .btn-primary:hover { background: #175860; }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { background: #D9ECEF; color: #46585C; cursor: not-allowed; }

  .btn-secondary {
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 11pt; color: #1F6F78; background: #FFFFFF;
    border: 1px solid #1F6F78; border-radius: 6px; padding: 14px 32px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; width: 100%;
    margin-top: 12px; touch-action: manipulation; display: block;
  }
  .btn-secondary:hover { background: #EAF7FA; }
  .btn-secondary:active { transform: translateY(1px); }

  .cover-title {
    font-family: 'Playfair Display', Georgia, serif; font-weight: 700;
    font-size: 20pt; color: #1E2F33;
    letter-spacing: -0.3px; margin-bottom: 14px; line-height: 1.2; text-align: center;
  }

  .cover-sub {
    font-family: 'Montserrat', sans-serif; font-size: 12pt; color: #46585C;
    line-height: 1.6; text-align: center; margin-bottom: 8px;
  }

  .email-label {
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 9pt; color: #1E2F33; text-transform: uppercase;
    letter-spacing: 1px; display: block; margin-bottom: 8px;
  }

  input[type="email"] {
    font-family: 'Montserrat', sans-serif; font-size: 12pt; color: #1E2F33;
    background: #FFFFFF; border: 1px solid #D9ECEF;
    padding: 14px; width: 100%; outline: none;
    touch-action: manipulation;
  }
  input[type="email"]:focus { border-color: #1F6F78; background: #FFFFFF; }
  input[type="email"]::placeholder { color: #46585C; }

  .privacy-note {
    font-family: 'Montserrat', sans-serif; font-weight: 400;
    font-size: 8pt; color: #46585C; text-align: center; margin-top: 14px;
  }

  .result-type {
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 18pt; color: #1F6F78; text-transform: uppercase;
    letter-spacing: 1px; text-align: center; margin-bottom: 8px;
  }

  .result-divider { border: none; border-top: 1px solid #D9ECEF; margin: 20px 0; }

  .result-body {
    font-family: 'Montserrat', sans-serif; font-size: 12pt;
    color: #1E2F33; line-height: 1.6; margin-bottom: 12px;
  }

  .result-note {
    font-family: 'Montserrat', sans-serif; font-size: 11pt;
    color: #46585C; line-height: 1.6; font-style: italic; margin-bottom: 0;
  }

  .error-msg {
    font-family: 'Montserrat', sans-serif; font-weight: 400;
    font-size: 9pt; color: #B00C60; margin-top: 8px; display: none;
  }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #1E2F33; border-bottom: 2px solid #1F6F78; color: #EAF7FA;
    font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 9pt; letter-spacing: 2px; text-transform: uppercase;
    padding: 12px 24px; z-index: 999; display: none;
  }

  @media (hover: none) and (pointer: coarse) {
    .btn-primary, .btn-secondary, .answer-btn { min-height: 44px; }
  }

  .quiz-close-btn {
    position: absolute;
    top: 14px; right: 14px;
    display: none;
    width: 36px; height: 36px;
    background: rgba(30,47,51,0.72);
    border: none; border-radius: 9999px;
    align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px; line-height: 1;
    color: #EAF7FA; z-index: 20;
    font-family: 'Montserrat', sans-serif;
  }
  .quiz-close-btn:hover { background: #1F6F78; }

  @media (max-width: 600px) {
    body { padding: 20px 12px; }
    .widget-container { padding: 28px 20px; }
    .cover-title { font-size: 15pt; }
    .scene:not(.scene-result) img {
      max-height: 220px !important;
    }
  }

  /* Hub look (Nov 2026): rounded, sentence case, Playfair headings */
  body { background-color: #FCFCFA; font-size: 11.5pt; }
  .widget-container { border-radius: 18px; border-color: #D9ECEF; box-shadow: 0 14px 34px -18px rgba(31,111,120,0.35); }
  .brand-tag, .brand-sub { color: #1F6F78; }
  h2.question { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; text-transform: none; letter-spacing: 0; font-size: 15pt; }
  .cover-title { font-family: 'Playfair Display', Georgia, serif; }
  .answers { gap: 8px; }
  .answer-btn, .answer-btn:last-child { border: 1px solid #D9ECEF; border-radius: 14px; }
  .answer-btn:hover, .answer-btn.selected { background: #EAF7FA; border-color: #1F6F78; }
  .btn-primary, .btn-secondary { border-radius: 999px; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .btn-primary:disabled { background: #D9ECEF; color: #46585C; }
  .progress-bar-bg, .progress-bar-fill { border-radius: 999px; }
  .progress-bar-fill { background: #F49B8F; }
  .result-type { font-family: 'Playfair Display', Georgia, serif; text-transform: none; letter-spacing: 0; font-size: 22pt; font-weight: 700; }
  .scene.scene-result { border-radius: 14px !important; background: #FFFFFF !important; }
  input[type="email"] { border-radius: 12px; }
  .email-label { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 10pt; }
  .toast { border-radius: 999px; text-transform: none; letter-spacing: 0; font-weight: 600; }
</style>
</head>
<body>

<a href="#content" class="skip-link">Skip to main content</a>
<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<div class="brand-tag" aria-hidden="true"><span></span>My Nest Chapter<span></span></div>
<div class="brand-sub" aria-hidden="true">For Single &amp; Solo Moms</div>

<main class="widget-container">
  <button class="quiz-close-btn" onclick="closeQuiz()" aria-label="Close quiz">&times;</button>
  <div id="content" tabindex="-1"></div>
</main>

<script>
const WORKBOOK_URL = 'https://hub.mynestchapter.com/#/shop/workbook';

function closeQuiz() {
  if (window.parent !== window) {
    window.parent.postMessage('closeQuiz', '*');
  } else {
    window.location.href = '/';
  }
}

// Only show the internal X button on the standalone page, not inside the popup
if (window.parent === window) {
  var closeBtn = document.querySelector('.quiz-close-btn');
  if (closeBtn) { closeBtn.style.display = 'flex'; }
}

let currentScreen = 0;
let answers = [];
let result = null;

const questions = [
  {
    scene: 'grocery',
    question: "You're at the grocery store. You look down at your cart and:",
    options: [
      { letter: 'A', text: "It's giving 'feeding a small soccer team.' Old habits. I'll figure it out." },
      { letter: 'B', text: "I have a list. I stuck to the list. I'm very busy and very fine." },
      { letter: 'C', text: "Half this stuff is for me. Half I have no idea why I grabbed." }
    ]
  },
  {
    scene: 'plates',
    question: "Dinnertime. You set the table and:",
    options: [
      { letter: 'A', text: "Started putting out extra plates before I caught myself. Again." },
      { letter: 'B', text: "I ate standing at the counter. I had somewhere to be after." },
      { letter: 'C', text: "I made something with onions. Because I can now. Small wins." }
    ]
  },
  {
    scene: 'cleaning',
    question: "It's Saturday. You cleaned the whole house because:",
    options: [
      { letter: 'A', text: "Habit. Also the Amazon driver might judge me." },
      { letter: 'B', text: "I had 45 minutes between things so I knocked it out." },
      { letter: 'C', text: "I started cleaning and then sat down in the middle of the floor for a while." }
    ]
  },
  {
    scene: 'movies',
    question: "You're at the movies. You bought:",
    options: [
      { letter: 'A', text: "Enough for everyone. Realized at the register. Kept it anyway." },
      { letter: 'B', text: "A water and a small popcorn. I had a good parking spot and wasn't rushing." },
      { letter: 'C', text: "Whatever I wanted. Which felt weird. But also kind of good." }
    ]
  },
  {
    scene: 'yelling',
    question: "Be honest. In the last week you yelled something into an empty house:",
    options: [
      { letter: 'A', text: '"Don\'t forget your charger." To no one. The charger is still there.' },
      { letter: 'B', text: "I don't have time to yell. I'm already in the car." },
      { letter: 'C', text: "I yelled something, caught myself, and then laughed about it for five minutes." }
    ]
  }
];

const scenes = {
  door:     `<img src="images/scene-door.png.png" alt="Stick figure at door with question mark">`,

  grocery:  `<img src="images/scene-grocery.png.png" alt="Stick figure with grocery cart">`,

  plates:   `<img src="images/scene-plate.png.png" alt="Stick figure holding plates at empty table">`,

  cleaning: `<img src="images/scene-cleaning.png.png" alt="Stick figure mopping kitchen">`,

  movies:   `<img src="images/scene-movies.png.png" alt="Stick figure with lots of popcorn">`,

  yelling:  `<img src="images/scene-yelling.png.png" alt="Stick figure yelling into empty house">`,

  email:    `<div style="background:#1F6F78;padding:32px;text-align:center;"><p style="font-family:'Montserrat',sans-serif;font-weight:800;font-size:13pt;color:#ffffff;text-transform:uppercase;letter-spacing:2px;margin:0;">My Nest Chapter</p></div>`,
  nester:   `<img src="scene-result-nester.png" alt="The Nester">`,
  busyer:   `<img src="scene-result-busyer.png" alt="The Busy-er">`,
  wonderer: `<img src="scene-result-wonderer.png" alt="The Wonderer">`
};

const results = {
  nester: {
    scene: 'nester',
    type: 'The Nester',
    body: `You still catch yourself reaching for an extra plate, and their room still looks the way they left it. I did that too. There's no rush. Your next chapter is right there whenever you're curious, and you get to open it at your own pace.`,
    note: `Check your email. I sent you something I made for right where you are.`
  },
  busyer: {
    scene: 'busyer',
    type: 'The Busy-er',
    body: `Your calendar hasn't had a blank square in a while. You keep everything moving, and that's a real skill. Maybe somewhere in all that busy there's one thing you'd pick for yourself. That might be a fun place to start.`,
    note: `Check your email. I sent you something for the five minutes between things.`
  },
  wonderer: {
    scene: 'wonderer',
    type: 'The Wonderer',
    body: `You're starting to ask what you want now. Some of it feels a little weird, and some of it feels kind of good. That's where the possibilities start to show up, and you get to choose which ones to try.`,
    note: `Check your email. I sent you something for exploring what's next.`
  }
};

function calculateResult() {
  const counts = { A: 0, B: 0, C: 0 };
  answers.forEach(a => counts[a]++);
  const max = Math.max(counts.A, counts.B, counts.C);
  if (counts.A === max) return 'nester';
  if (counts.B === max) return 'busyer';
  return 'wonderer';
}

function render(html) {
  const el = document.getElementById('content');
  el.classList.remove('content-enter');
  void el.offsetWidth;
  el.innerHTML = html;
  el.classList.add('content-enter');
  el.focus();
}

function progressHTML(step) {
  if (step < 1 || step > 5) return '';
  const pct = (step / 5) * 100;
  return `<div class="progress-wrap">
    <div class="progress-label">Question ${step} of 5</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" style="transform:scaleX(${pct/100})" role="progressbar" aria-valuenow="${step}" aria-valuemin="0" aria-valuemax="5"></div>
    </div>
  </div>`;
}

function showCover() {
  currentScreen = 0;
  answers = [];
  render(`
    <div class="scene">${scenes.door}</div>
    <h1 class="cover-title">What Kind of Empty Nester Are You?</h1>
    <button class="btn-primary" onclick="showQuestion(0)">Let's find out</button>
  `);
}

function showQuestion(index) {
  currentScreen = index + 1;
  const q = questions[index];
  const selectedAnswer = answers[index];
  const optionsHTML = q.options.map(o => `
    <button class="answer-btn${selectedAnswer === o.letter ? ' selected' : ''}"
      onclick="selectAnswer(${index}, '${o.letter}')"
      aria-pressed="${selectedAnswer === o.letter}">
      <span class="answer-letter">${o.letter}</span>${o.text}
    </button>
  `).join('');
  render(`
    ${progressHTML(index + 1)}
    <div class="scene">${scenes[q.scene]}</div>
    <h2 class="question">${q.question}</h2>
    <div class="answers" role="group" aria-label="Answer options">${optionsHTML}</div>
    <button class="btn-primary" id="nextBtn" onclick="handleNext(${index})" ${selectedAnswer ? '' : 'disabled'}>
      ${index < 4 ? 'Next question' : 'See my result'}
    </button>
    ${index > 0 ? `<button class="btn-secondary" onclick="showQuestion(${index - 1})">Back</button>` : ''}
  `);
}

function selectAnswer(qIndex, letter) {
  answers[qIndex] = letter;
  showQuestion(qIndex);
}

function handleNext(index) {
  if (!answers[index]) return;
  if (index < 4) { showQuestion(index + 1); } else { showEmailCapture(); }
}

function showEmailCapture() {
  currentScreen = 6;
  result = calculateResult();
  render(`
    <div class="scene">${scenes.email}</div>
    <h2 style="font-family:'Montserrat',sans-serif;font-weight:800;font-size:16pt;color:#1E2F33;letter-spacing:0;margin-bottom:12px;text-align:center;font-family:'Playfair Display',Georgia,serif;">Okay. Your result is ready.</h2>
    <p style="font-family:'Montserrat',sans-serif;font-size:12pt;color:#1E2F33;line-height:1.6;margin-bottom:24px;text-align:center;">Drop your email and I'll send it over, plus something small I made that goes with your type.</p>
    <div class="input-group">
      <label class="email-label" for="emailInput">Your email address</label>
      <input type="email" id="emailInput" placeholder="you@email.com" autocomplete="email" aria-required="true"/>
      <p class="error-msg" id="emailError" role="alert">Please enter a valid email address.</p>
    </div>
    <button class="btn-primary" onclick="submitEmail()">Send me my result</button>
    <p class="privacy-note">No spam. Your result and something I made for you.</p>
  `);
}

async function submitEmail() {
  const emailInput = document.getElementById('emailInput');
  const errorMsg = document.getElementById('emailError');
  const email = emailInput.value.trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errorMsg.style.display = 'block';
    emailInput.focus();
    return;
  }
  errorMsg.style.display = 'none';
  const btn = document.querySelector('.btn-primary');
  btn.textContent = 'Sending…';
  btn.disabled = true;
  try {
    const res = await fetch('/quiz-submit.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, result })
    });
    const data = await res.json();
    if (res.ok && data.success) { showResult(); }
    else { throw new Error(); }
  } catch {
    btn.textContent = 'Send me my result';
    btn.disabled = false;
    document.getElementById('emailError').textContent = 'Something went wrong. Please try again.';
    document.getElementById('emailError').style.display = 'block';
  }
}

function showResult() {
  currentScreen = 7;
  const r = results[result];
  render(`
    <div class="scene scene-result">${scenes[r.scene]}</div>
    <p class="result-type">${r.type}</p>
    <hr class="result-divider">
    <p class="result-body">${r.body}</p>
    <p class="result-note">${r.note}</p>
    <hr class="result-divider">
    <a href="${WORKBOOK_URL}" class="btn-primary" style="text-decoration:none;display:block;text-align:center;" target="_blank">See the Now What? Workbook</a>
    <button class="btn-secondary" onclick="showCover()">Take the quiz again</button>
  `);
}

showCover();
</script>
</body>
</html>
